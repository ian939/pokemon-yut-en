}
function showDests(ms, cpu) {
  const box = $("#dests");
  if (!box) return;
  box.innerHTML = "";
  distinctDests(ms).forEach(m => {
    const b = document.createElement("button");
    const at = m.finish ? "goal" : m.to.node;
    b.className = "dest" + (m.finish ? " goal" : m.capture.length ? " hit" : m.result < 0 ? " back" : "") + (cpu ? " cpu" : "") +
      (nodeXY(at)[0] >= 50 ? " flip" : ""); // 판 오른쪽 반은 말풍선을 왼쪽으로 늘인다 (영어 글이 길어 판 밖으로 잘리지 않게)
    placeAt(b, at);
    b.dataset.move = m.id;
    b.setAttribute("aria-label", m.finish ? "Goal" : (yutWord(m.result) || {}).word || RES[m.result].name);
    const wild = !m.finish && (G.s.spots || []).some(sp => !sp.used && sp.node === m.to.node);
    b.innerHTML = "<b>" + (m.finish ? "🏁 Goal!" : resLabel(m.result) + (m.capture.length ? " Battle!" : m.stack.length ? " Stack" : "") + (wild ? " 🌿" : "") + "<small>" + RES[m.result].steps + "</small>") + "</b>";
    b.addEventListener("click", ev => { ev.stopPropagation(); if (!G.busy && humanTurn()) doMove(m.id); });

}
function onUnitTap(el) {
  if (G.target) { const d = $('#dests .dest[data-node="' + el.dataset.node + '"]'); if (d) d.click(); else toast("Tap a sparkling spot! (To stop, tap ✖ Cancel)"); return; }
  if (G.busy || !G.s || G.s.phase !== "choose" || !humanTurn()) return;
  if (Number(el.dataset.team) !== G.s.turn) { toast("That's the other team's piece!"); return; }
  const key = "n" + el.dataset.node;
  const ms = G.moves.filter(m => m.unit === key);
  if (!ms.length) { toast("This piece can't move now."); return; }

function onChipTap(i) {
  if (G.target) {
    if (G.target.kind === "enemyPiece" && G.target.targets.indexOf(i) >= 0) doSkill(G.target.piece, i, G.target.slot);
    else toast("Tap a sparkling spot! (To stop, tap ✖ Cancel)");
    return;
  }
  if (!G.s) return;
  const p = G.s.pieces[i];
  if (G.busy) { toast(pieceLine(i), 2400); return; }           // 연출 중: 한 줄로만
  // 말을 고를 차례가 아니거나(던지기 전·상대 차례·골인) 상대 팀 말이면 → 🔍 포켓몬·기술 보기
  const canPick = G.s.phase === "choose" && humanTurn() && p.team === G.s.turn &&

/* ---------- 던지기 ---------- */
const Force = { q: (Q.get("force") || "").split(",").filter(Boolean).map(Number), next() { return this.q.length ? this.q.shift() : null; } };

  const t = r.events[0];

    await animSticks(t.sticks);

    if (t.rained) { toast("🌧️ Rain power! " + RES[t.rained].name + " → Gae!", 1600); await sleep(800); }

          : '<div class="result-name">' + info.name + '!<span class="result-en">' + info.en + "</span></div>" +
            '<div class="result-sub">' + info.emoji + " " + info.steps + "</div>") + "</div>";
    document.body.appendChild(w);
    if (wd) { // 긴 단어(watermelon·Wednesday)는 도트 글꼴이 또렷한 크기(66·44·33·22)로만 줄인다

      for (const px of [66, 44, 33, 22]) { if (px > parseFloat(getComputedStyle(rw).fontSize)) continue; rw.style.fontSize = px + "px"; if (rw.scrollWidth <= rw.clientWidth + 1) break; }

/* ---------- 두기 ---------- */
async function doMove(id) {
  if (G.busy || !G.s) return;
  const m = G.moves.find(x => x.id === id);
  if (!m) return;
  G.busy = true;
  G.moves = [];
  $("#dests").innerHTML = "";
  $$(".unit.can, .unit.sel").forEach(e => e.classList.remove("can", "sel"));
  const prev = G.s;
  const missed = humanTurn() && !m.capture.length ? Yut.legalMoves(prev).find(x => x.capture.length && !x.finish) : null; // 💡 잡을 수 있었는데 다른 수를 둠
  const r = Yut.applyMove(prev, id, m.unit === "new" ? G.newPick : undefined);
  G.s = r.state;
  persist();
  netSend(r.events, true);
  renderTop();
  renderPending(); // 방금 쓴 결과는 바로 칩에서 뺀다
  try { await playEvents(r.events, prev); } catch (e) { console.error(e); }
  if (missed && current === "game" && G.s.phase !== "over") {
    fxAt(missed.to.node, "⚔️");
    toast("💡 Oh! You could have knocked out " + nameOf(Yut.formOf(prev, missed.capture[0])) + " with " + RES[missed.result].name + "!", 2600);
    await sleep(900);
  }
  G.newPick = null;
  G.sel = null;
  netSend([], giftMine()); // 조우·말 바꾸기까지 끝난 판을 올린다 (선물 고르기가 남았으면 아직 기다리게)
  G.busy = false;
  afterAction();
}
async function playEvents(events, prev) {
  for (const e of events) {
    if (current !== "game") return;
    if (e.type === "move") await animMove(e, prev);
    else if (e.type === "capture") await animCapture(e, prev);
    else if (e.type === "stack") await animStack(e, prev);
    else if (e.type === "evolve") await animEvolve(e);
    else if (e.type === "wild") await animWild(e);
    else if (e.type === "finish") await animFinish(e);
    else if (e.type === "bonus") { SFX.again(); await banner("Knocked out! Throw again!", null, 1000, "gold"); }
    else if (e.type === "skip") await animSkip(e);
    else if (e.type === "turn") { renderAll(); await announceTurn(e.team); }
    else if (e.type === "win") await showWin(e.team);
    else if (EVENT_ANIM[e.type]) await EVENT_ANIM[e.type](e, prev);
  }
}
async function animMove(e, prev) {
  let el;
  if (e.unit === "new") {
    el = unitEl(prev, e.team, 0, e.pieces);
    el.classList.add("enter");
    $("#units").appendChild(el);
    renderPanelFrom(prev, e.pieces);
    SFX.pop();
    await sleep(340);
  } else {
    el = unitAt(e.team, e.from.node);
    if (!el) { el = unitEl(prev, e.team, e.from.node, e.pieces); $("#units").appendChild(el); }
  }
  el.classList.remove("can", "sel");
  el.classList.add("moving");
  const back = !!(e.back || e.result < 0);
  let cnt = null;
  if (e.fly && e.path.length) {                // 🦅 공중날기: 한 번에 훨훨
    el.classList.add("flying");
    SFX.throwBall();
    placeAt(el, e.path[e.path.length - 1]);
    await sleep(650);
    el.classList.remove("flying");
  } else for (let k = 0; k < e.path.length; k++) {
    placeAt(el, e.path[k]);
    el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop");
    SFX.hop(k);
    // 🔢 영어로 칸 세기: 칸 위에 "2 two" + 소리 "two" (녹음된 숫자) — 세는 소리가 들리게 한 칸씩 조금 천천히
    if (cnt) cnt.remove(); // 앞 칸 숫자는 바로 치운다 (다음 칸에 선 말을 가리지 않게)
    cnt = fxAt(e.path[k], "<b>" + (k + 1) + "</b><i>" + numWord(k + 1) + "</i>", "fx-count" + (back ? " back" : ""));
    TTS.say(String(k + 1));
    await sleep(back ? 480 : 440);
  }
  if (e.path.length) { // 다 가면 몇 칸 갔는지 한 줄 ("3 spaces!" / "Back 1 space!")
    const n = e.path.length, sp = n + (n === 1 ? " space" : " spaces");
    const x = nodeXY(e.path[n - 1])[0]; // 판 가장자리에서는 말풍선이 판 안쪽으로 펼쳐지게
    fxAt(e.path[n - 1], esc((back ? "⬅ Back " : "➡ ") + sp + "!"), "fx-sum" + (back ? " back" : "") + (x > 70 ? " r" : x < 30 ? " l" : ""), 1500);
  }
  el.classList.remove("moving", "hop", "enter");
  el.dataset.node = e.finish ? 0 : e.to.node; // 골인한 말은 참먹이(0)에 서 있다가 빠져나간다
  G.lastEl = el;
}
// 새 말이 나가는 순간 패널의 그 칸만 먼저 "판 위"로 바꿔 보여 준다
function renderPanelFrom(prev, pieces) {

}
async function animCapture(e, prev) {

/* ---------- 배틀: 상대 말이 있는 칸에 멈추면 기술로 물리친다 → 진 포켓몬은 집(출발 자리)으로 ---------- */
const backUrl = id => "assets/sprites/back/" + id + ".png";

function btSprite(id, back, x, footY, w, cls) {

const WILD_TEAM = { name: "🌿 Wild", color: "#3a9d4f" };
// 무대 위 표시가 무대 밖으로 나가면 안쪽으로 당긴다 (글자가 큰 패드·좁은 폰)
function fitInStage(c, el) {
  // 튀어나오는 연출(크기 변화) 중에도 맞게: 화면상 크기가 아니라 원래 너비(offsetWidth)로 잰다. 가운데 맞춤(translate -50%) 기준

const RARITY_KO = { c: vo("Common"), r: vo("Rare"), u: vo("Unique"), l: vo("Legendary") };
const RARITY_STAR = { c: "", r: "⭐", u: "⭐⭐", l: "👑" };
// 기술을 쓸 수 있는 때 (v8, 사용자 확정 2026-09-28): 일반~전설 모두 10칸 (전에는 희귀도로 15·10·5·처음부터)
const SKILL_NEED = 10;

const skillNeedOf = () => SKILL_NEED;
// 🎲 기술이 성공할 확률의 희귀도 (v8): 일반 60 · 레어 70 · 유니크 80 · 전설 90%, 상대 말 하나에 거는 기술은 상성 ±10%
// 스타팅 포켓몬 가족은 모두 레어로 (데이터로는 1~3세대 레어 · 4~9세대 유니크라 들쭉날쭉)
const chanceRar = id => STARTERS.indexOf(rootOf(id)) >= 0 ? "r" : isLegend(id) ? "l" : rarityOf(id);
const pctTxt = c => Math.round(c * 100) + "%";
const matchTxt = m => m > 0 ? " 💥+10%" : m < 0 ? " 💧−10%" : "";
// 옛 판·다른 패드에서 온 판에 희귀도·타입이 없으면 채운다
function fillV8(st) {

/* ---------- 배틀 무대 — 상대 말과의 배틀 · ❓ 풀숲 야생 조우가 같이 쓴다 ----------

function openStage(o) {
  const n = o.foes.length;
  const fw = n > 1 ? 20 : 25;                                // 업힌 말과 붙으면 여럿이 조금 작게 나란히
  const offs = n === 1 ? [0] : n === 2 ? [-7, 7] : [-11, 0, 11];
  const foeXY = o.foes.map((_, k) => [72 + offs[k], 59 + (k % 2) * 2]);
  const el = document.createElement("div");
  el.className = "battle";
  el.innerHTML =
    '<div class="bt-stage">' +
      '<i class="bt-pad foe"></i><i class="bt-pad ally"></i>' +
      o.foes.map((id, k) => btSprite(id, false, foeXY[k][0], foeXY[k][1], fw, "foe")).join("") +
      btSprite(o.ally, true, 27, 94, 33, "ally") +
      btPlate("foe", o.foes.map(nameOf).join("·"), o.foeTeam, o.foeExtra) + btPlate("ally", nameOf(o.ally), o.allyTeam) +
      '<div class="bt-flash"></div><div class="bt-fx"></div><div class="bt-intro"></div>' +
    "</div>" +
    '<div class="bt-dialog"><p class="bt-text"></p><div class="bt-menu"></div><i class="bt-more">▼</i></div>' +
    '<button class="btn bt-skip">Skip ⏭</button>';
  document.body.appendChild(el);
  let resolveDone, typer = null, menuResolve = null;
  const c = {
    el, foeXY, n,
    stage: $(".bt-stage", el), fx: $(".bt-fx", el), text: $(".bt-text", el), dialog: $(".bt-dialog", el), menuEl: $(".bt-menu", el),
    foeEls: $$(".bt-mon.foe", el), allyEl: $(".bt-mon.ally", el),
    skip: false, closed: false,
  };
  c.done = new Promise(r => { resolveDone = r; });
  $$(".bt-plate b", el).forEach(fitPlateName);
  if (o.allyLater) { c.allyEl.style.opacity = "0"; $(".bt-plate.ally", el).style.opacity = "0"; }
  c.live = () => !c.skip;
  c.wait = ms => c.skip ? Promise.resolve() : sleep(ms);
  c.anim = (node, frames, ms, opt) => {
    if (!node || !node.animate || c.skip) return Promise.resolve();
    const a = node.animate(frames, Object.assign({ duration: ms * SPEED, fill: "forwards", easing: "ease-out" }, opt || {}));
    return a.finished ? a.finished.catch(() => {}) : sleep(ms);
  };
  c.put = (cls, html, x, y) => {
    const s = document.createElement("span");
    s.className = cls;
    s.innerHTML = html;
    s.style.left = x + "%"; s.style.top = y + "%";
    c.fx.appendChild(s);
    return s;
  };
  // 대화창: 한 글자씩 — 누르면 바로 다 보인다. speak: true = msg 를 그대로 읽기 · 글/[조각…] = 그것을 읽기 (영어판: 녹음 규칙)
  c.say = (msg, speak) => new Promise(res => {
    clearInterval(typer);
    c.menuEl.innerHTML = "";
    if (c.skip) { c.text.textContent = msg; return res(); }
    if (speak) TTS.say(speak === true ? msg : speak);
    const chars = Array.from(msg);
    let i = 0;
    c.text.textContent = "";
    const done = () => { clearInterval(typer); c.text.textContent = msg; c.dialog.onclick = null; res(); };
    c.dialog.onclick = done;
    typer = setInterval(() => { i++; c.text.textContent = chars.slice(0, i).join(""); if (i >= chars.length) done(); }, Math.max(6, 34 * SPEED));
  });
  // 대화창 아래 DS 메뉴: [{ key, html, cls }] → 고른 key (건너뛰기면 null)
  c.menu = items => new Promise(res => {
    if (c.skip) return res(null);
    menuResolve = res;
    c.dialog.onclick = null;
    c.menuEl.innerHTML = items.map(it => '<button class="btn ' + (it.cls || "") + '" data-key="' + esc(it.key) + '">' + it.html + "</button>").join("");
    $$("button", c.menuEl).forEach(b => b.addEventListener("click", ev => {
      ev.stopPropagation();
      menuResolve = null;
      c.menuEl.innerHTML = "";
      SFX.tap();
      res(b.dataset.key);
    }));
  });
  c.close = () => {
    if (c.closed) return;
    c.closed = true;
    clearInterval(typer);
    if (menuResolve) { const r = menuResolve; menuResolve = null; r(null); }
    el.classList.add("out");
    setTimeout(() => { el.remove(); resolveDone(); }, 260 * SPEED);
  };
  $(".bt-skip", el).addEventListener("click", ev => { ev.stopPropagation(); c.skip = true; TTS.stop(); c.close(); });
  return c;
}
// 기술: 달려들기 → 타입 이펙트 5개 → 타입 색 번쩍 + 💥 + 흔들림 + 상대 HP 0
async function stageAttack(c, atk) {
  if (c.live()) { SFX.attack(); Cry.play(atk); }
  c.anim(c.allyEl, [{ transform: "none" }, { transform: "translate(14%, -12%)", offset: 0.35 }, { transform: "none" }], 460);
  await c.wait(180);
  for (let k = 0; k < 5 && c.live(); k++) {
    const [tx, ty] = c.foeXY[k % c.n];
    const p = c.put("bt-proj", fxOf(atk), 32, 72);
    c.anim(p, [{ left: "32%", top: "72%", transform: "translate(-50%,-50%) scale(.5)" }, { left: tx + "%", top: (ty - 14) + "%", transform: "translate(-50%,-50%) scale(1.35)" }], 420, { easing: "ease-in" })
      .then(() => p.remove());
    await c.wait(90);
  }
  await c.wait(380);
  if (!c.live()) return;
  SFX.hit();
  const fl = $(".bt-flash", c.el);
  fl.style.background = D.typeColors[typesOf(atk)[0]] || "#ffcf40";
  c.anim(fl, [{ opacity: 0.75 }, { opacity: 0 }], 420, { fill: "none" });
  c.foeXY.forEach(([x, y]) => { const b = c.put("bt-burst", "💥", x, y - 14); c.anim(b, [{ transform: "translate(-50%,-50%) scale(.3)", opacity: 1 }, { transform: "translate(-50%,-50%) scale(1.5)", opacity: 0 }], 520).then(() => b.remove()); });
  c.foeEls.forEach(el => c.anim(el, SHAKE_FRAMES, 520));
  const fill = $(".bt-plate.foe .fill", c.el);
  if (fill) fill.classList.add("low");
}
// 폴짝 뛰었다가 💨 오른쪽으로 달려 나간다 (배틀에 진 포켓몬은 집으로, 야생은 풀숲으로)
function stageRunOff(c) {
  c.foeEls.forEach((el, k) => {
    const [x, y] = c.foeXY[k];
    const puff = c.put("bt-proj", "💨", x - 8, y - 5);
    c.anim(puff, [{ transform: "translate(-50%,-50%) scale(.5)", opacity: 0.9 }, { transform: "translate(-120%,-50%) scale(1.3)", opacity: 0 }], 700).then(() => puff.remove());
    c.anim(el, [
      { transform: "none", opacity: 1 },
      { transform: "translateY(-18%)", offset: 0.25 },
      { transform: "translateY(0)", offset: 0.45 },
      { transform: "translateX(170%)", opacity: 0 }], 850, { easing: "ease-in", delay: k * 120 * SPEED });
  });
}
function stageStars(c, x, y) {
  ["✨", "⭐", "✨", "🌟", "✨"].forEach((s, i) => {
    const st = c.put("bt-star", s, x, y);
    const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
    c.anim(st, [{ transform: "translate(-50%,-50%) scale(.3)", opacity: 1 }, { transform: "translate(calc(-50% + " + (Math.cos(a) * 110).toFixed(0) + "px), calc(-50% + " + (Math.sin(a) * 80).toFixed(0) + "px)) scale(1.1)", opacity: 0 }], 900).then(() => st.remove());
  });
}
// 볼 던지기: 포물선 → 번쩍 → 빨려 들어감 → 떨어짐 → res.shakes 번 흔들 → 딸깍(성공) / 튀어나옴(실패)
async function stageThrow(c, ball, res) {
  const [x, y] = c.foeXY[0];
  const b = document.createElement("img");
  b.className = "bt-ball";
  b.alt = "";
  b.src = "assets/items/" + Yut.Rewards.BALL_INFO[ball].img + ".png";
  b.style.left = "22%"; b.style.top = "82%";
  c.fx.appendChild(b);
  if (c.live()) SFX.throwBall();
  await c.anim(b, [
    { left: "22%", top: "82%", transform: "translate(-50%,-50%) rotate(0deg)" },
    { left: ((22 + x) / 2) + "%", top: "12%", transform: "translate(-50%,-50%) rotate(420deg)", offset: 0.5 },
    { left: x + "%", top: (y - 22) + "%", transform: "translate(-50%,-50%) rotate(760deg)" }], 640, { easing: "linear" });
  const fl = $(".bt-flash", c.el);
  if (c.live()) { fl.style.background = "#fff"; c.anim(fl, [{ opacity: 0.8 }, { opacity: 0 }], 300, { fill: "none" }); }
  await c.anim(c.foeEls[0], [
    { transform: "none", filter: "none", opacity: 1 },
    { transform: "none", filter: "brightness(1.6) sepia(1) hue-rotate(-50deg) saturate(6)", offset: 0.35 },
    { transform: "translateY(-20%) scale(0)", filter: "brightness(3)", opacity: 0 }], 480, { easing: "ease-in" });
  await c.anim(b, [
    { left: x + "%", top: (y - 22) + "%", transform: "translate(-50%,-50%) rotate(760deg)" },
    { left: x + "%", top: (y - 4) + "%", transform: "translate(-50%,-50%) rotate(720deg)" }], 320, { easing: "cubic-bezier(.5,0,.6,1.6)" });
  await c.wait(260);
  for (let s = 0; s < res.shakes && c.live(); s++) {
    SFX.shake();
    await c.anim(b, [
      { transform: "translate(-50%,-50%) rotate(0deg)" }, { transform: "translate(-50%,-50%) rotate(-24deg)", offset: 0.3 },
      { transform: "translate(-50%,-50%) rotate(20deg)", offset: 0.7 }, { transform: "translate(-50%,-50%) rotate(0deg)" }], 400, { fill: "none" });
    await c.wait(180);
  }
  if (!c.live()) { b.remove(); return; }
  if (res.ok) {
    SFX.catchOk();
    stageStars(c, x, y - 4);
    c.stage.querySelectorAll(".bt-rar").forEach(e => e.remove()); // 등급 표시는 치우고 "잡았다!"만
    c.stage.insertAdjacentHTML("beforeend", '<div class="bt-stamp">Gotcha!</div>'); fitStamp(c.stage.lastElementChild);
    return;
  }
  SFX.pop();
  fl.style.background = "#fff";
  c.anim(fl, [{ opacity: 0.7 }, { opacity: 0 }], 260, { fill: "none" });
  c.anim(b, [{ transform: "translate(-50%,-50%) scale(1)", opacity: 1 }, { transform: "translate(-50%,-50%) scale(1.8)", opacity: 0 }], 300).then(() => b.remove());
  await c.anim(c.foeEls[0], [
    { transform: "translateY(-20%) scale(0)", filter: "brightness(3)", opacity: 0 },
    { transform: "none", filter: "none", opacity: 1 }], 380, { easing: "cubic-bezier(.2,1.5,.4,1)" });
}

// 배틀 장면을 건너뛸 때: 윷판 위에서 💥 + 안내 칸 한 줄로 끝 (진 말이 집으로 가는 건 그대로)
async function quickBattle(e, prev) {
  const atk = Yut.formOf(prev, e.by[0]);
  const aTeam = prev.teams[prev.pieces[e.by[0]].team], vTeam = prev.teams[prev.pieces[e.victims[0]].team];
  const foeNames = e.victims.map(i => nameOf(Yut.formOf(prev, i))).join("·");
  SFX.attack();
  await sleep(220);
  SFX.hit();
  fxAt(e.node, "💥");
  const mv = e.skill ? skillName(e.skill) : moveOf(atk);
  const sup = superEffective(atk, e.victims.map(i => Yut.formOf(prev, i)));
  if (sup) setTimeout(() => { if (current === "game") toast("💥 It's super effective! " + sup, 2200); }, 1300 * SPEED);
  toast(aTeam.cpu ? "Team Rocket knocked out " + foeNames + ", meow! 😼"
    : vTeam.cpu ? nameOf(atk) + " used " + mv + "! Knocked out Team Rocket's " + foeNames + "!"
    : nameOf(atk) + " used " + mv + "! Knocked out " + foeNames + "!", 2400);
  TTS.say(aTeam.cpu ? "Team Rocket won the battle, meow!" : "Knocked out!");
  await sleep(650);
}

/* ---------- 배틀: 상대 말이 있는 칸에 멈추면 — 기술로 물리친다 → 진 포켓몬은 집(출발 자리)으로 ---------- */
function battle(e, prev) {
  const atk = Yut.formOf(prev, e.by[0]);
  const aTeam = prev.teams[prev.pieces[e.by[0]].team];
  const vTeam = prev.teams[prev.pieces[e.victims[0]].team];
  const foes = e.victims.map(i => Yut.formOf(prev, i));
  const foeNames = foes.map(nameOf).join("·");
  const c = openStage({ foes, foeTeam: vTeam, ally: atk, allyTeam: aTeam });
  (async () => {
    // ① 등장: 줄무늬 섬광 → 양쪽에서 미끄러져 들어옴
    SFX.battle();
    c.foeEls.forEach(el => c.anim(el, [{ transform: "translateX(90%)", opacity: 0 }, { transform: "none", opacity: 1 }], 520));
    c.anim(c.allyEl, [{ transform: "translateX(-90%)", opacity: 0 }, { transform: "none", opacity: 1 }], 520);
    await c.wait(600);
    if (c.live()) Cry.play(foes[0]);
    await c.say("Look! It's " + vTeam.name + "'s " + foeNames + "!");
    await c.wait(550);
    // ② 기술
    const mv = e.skill ? skillName(e.skill) : moveOf(atk);
    await c.say(nameOf(atk) + " used " + mv + "!", [nameOf(atk), vo("used"), mv]);
    await stageAttack(c, atk);
    await c.wait(750);
    const sup = superEffective(atk, foes);
    if (sup && c.live()) {
      c.stage.classList.remove("quake"); void c.stage.offsetWidth; c.stage.classList.add("quake");
      c.stage.insertAdjacentHTML("beforeend", '<div class="bt-stamp super">It\'s super effective!</div>'); fitStamp(c.stage.lastElementChild);
      SFX.hit();
      await c.say("It's super effective! " + sup, vo("It's super effective!"));
      await c.wait(700);
      const st = $(".bt-stamp.super", c.el); if (st) st.remove();
    }
    await c.say(foeNames + (foes.length > 1 ? " are" : " is") + " all tired out!");
    await c.wait(450);
    // ③ 물리쳤다!
    if (c.live()) {
      SFX.catchOk();
      stageStars(c, 27, 70);
      c.stage.insertAdjacentHTML("beforeend", '<div class="bt-stamp">Knocked out!</div>'); fitStamp(c.stage.lastElementChild);
    }
    if (aTeam.cpu) await c.say("Team Rocket knocked out " + foeNames + ", meow! 😼", vo("Team Rocket won the battle, meow!"));
    else if (vTeam.cpu) await c.say("You knocked out Team Rocket's " + foeNames + "! Team Rocket lost again, meow!", [vo("You knocked out")].concat(foes.map(nameOf), [vo("Team Rocket lost again, meow!")]));
    else await c.say("Yay! You knocked out " + foeNames + "!", [vo("Yay! You knocked out")].concat(foes.map(nameOf)));
    await c.wait(700);
    // ④ 집으로 — 쓰러지지 않는다 (영영 지는 게 아니라 처음부터 다시)
    if (c.live()) SFX.runHome();
    stageRunOff(c);
    await c.say(foeNames + " ran back home. " + (foes.length > 1 ? "They" : "It") + " will start again, still evolved!");
    await c.wait(900);
    c.close();
  })().catch(err => { console.error(err); c.close(); });
  return c.done;
}

/* ---------- ❓ 풀숲: 야생 포켓몬 — 가방의 볼로 잡는다 (v2) ---------- */
const FORCE_CATCH = Q.get("catch"); // 테스트용: ?catch=1 늘 성공 / ?catch=0 늘 실패
// 👤 판의 팀 → 이 패드의 프로필 (친구 대결: 내 팀만 · 로켓단: 없음)
const teamPid = ti => { const t = G.s.teams[ti]; if (!t || t.cpu) return null; if (netOn()) return ti === G.net.me ? G.net.pid : null; return Store.data.profiles[t.key] ? t.key : null; };
const gamePid = () => { if (!G.s) return Store.data.settings.t0; if (netOn()) return G.net.pid; const h = teamPid(G.s.turn) || G.s.teams.map((t, i) => teamPid(i)).find(Boolean); return h || Store.data.settings.t0; };
async function animWild(e) {
  if (teamPid(e.team)) Store.use(teamPid(e.team)); // 잡은 포켓몬·볼·시계 기록은 그 팀 프로필에
  const spotEl = $('#spots .spot[data-node="' + e.node + '"]');
  if (spotEl) spotEl.classList.add("shake");
  if (netOn() && e.team !== G.net.me) { // 🏠 친구 팀의 조우는 친구 패드에서
    toast("🌿 " + G.s.teams[e.team].name + " found a wild Pokémon in the tall grass!", 2400);
    await sleep(900);
  } else if (G.s.teams[e.team].cpu) { rollSpot(e, false); await rocketNet(e); }
  else if (netOn()) { rollSpot(e, false); await encounter(e, true); } // 🏠 친구 대결: 문제 없이, 볼은 저절로 (친구가 기다리니까)
  else {
    await sleep(450);
    const right = studyOn() ? await clockQuiz() : 0; // 🕐 맞힌 수만큼 이번 조우만 유니크·전설 ↑
    rollSpot(e, right);
    await encounter(e);
  }
  if (spotEl) spotEl.remove();
  if (G.swapAfter) { const x = G.swapAfter; G.swapAfter = null; await afterSwapBoard(x); }
}
// 🏠 친구 대결 풀숲 (사용자 확정 2026-09-29): 몬스터볼이 저절로 한 번, 잡을 확률 70% (가방 볼은 안 씀) · 잡으면 말 바꾸기는 고를 수 있음
const NET_CATCH = 0.7;
function encounter(e, auto) {
  const R = Yut.Rewards;
  const prof = Store.prof(teamPid(e.team) || gamePid()); // 👤 이 조우의 기록은 처음 정한 이 프로필에 (조우 중에 다른 일이 생겨도 바뀌지 않게)
  const id = e.id, name = nameOf(id);
  const ally = Yut.formOf(G.s, e.pieces[0]);
  const aTeam = G.s.teams[e.team];
  const isNew = !ownedSet(prof.id).has(id);
  const rar = rarityOf(id);
  const extra = ""; // 희귀도·NEW!는 포켓몬 옆 큰 표시로 (이름판에 넣으면 이름이 "프로…"로 잘림)
  const c = openStage({ foes: [id], foeTeam: WILD_TEAM, foeExtra: extra, ally, allyTeam: aTeam, allyLater: true });
  const rarTag = () => fitInStage(c, c.put("bt-rar r-" + rar, (isNew ? '<i class="bp-tag new">NEW!</i> ' : "") + (RARITY_STAR[rar] ? RARITY_STAR[rar] + " " : "") + RARITY_KO[rar], c.foeXY[0][0], c.foeXY[0][1] - 30)); // 포켓몬 바로 위 (무대 밖으로 나가면 안으로 당긴다)
  prof.stats.wildSeen = (prof.stats.wildSeen || 0) + 1;
  Store.save();
  (async () => {
    // ① 풀숲에서 튀어나옴
    SFX.battle();
    const grass = c.put("bt-grass", "", c.foeXY[0][0], c.foeXY[0][1] - 6);
    c.anim(grass, [{ transform: "translate(-50%,-50%) rotate(-10deg)" }, { transform: "translate(-50%,-50%) rotate(10deg)", offset: 0.25 },
      { transform: "translate(-50%,-50%) rotate(-10deg)", offset: 0.5 }, { transform: "translate(-50%,-50%) scale(1.4)", opacity: 0 }], 700).then(() => grass.remove());
    c.anim(c.foeEls[0], [{ transform: "translateY(25%) scale(.2)", opacity: 0 }, { transform: "translateY(25%) scale(.2)", opacity: 0, offset: 0.55 },
      { transform: "translateY(-12%) scale(1.05)", opacity: 1, offset: 0.8 }, { transform: "none", opacity: 1 }], 900);
    await c.wait(900);
    if (rar === "l" && c.live()) { // 👑 전설: 무대가 흔들리고 금빛으로 번쩍 + 도장
      c.stage.classList.add("quake", "legend"); setTimeout(() => c.stage.classList.remove("quake"), 650 * SPEED);
      const fl = $(".bt-flash", c.el); fl.style.background = "radial-gradient(circle, #fff6c2, #f5b82e)"; c.anim(fl, [{ opacity: 0.95 }, { opacity: 0 }], 900, { fill: "none" });
      SFX.win();
      c.stage.insertAdjacentHTML("beforeend", '<div class="bt-stamp legend">👑 Legendary Pokémon!</div>'); fitStamp(c.stage.lastElementChild);
      setTimeout(() => { const st = $(".bt-stamp.legend", c.el); if (st) st.remove(); }, 1800 * SPEED);
    }
    if (c.live()) Cry.play(id);
    rarTag();
    await c.say("A wild " + (rar === "c" ? "" : RARITY_KO[rar] + " ") + name + " appeared!", rar === "c" ? [vo("A wild"), name, vo("appeared!")] : [vo("A wild"), RARITY_KO[rar], name, vo("appeared!")]);
    await c.wait(500);
    // ② 내 포켓몬 등장
    c.allyEl.style.opacity = ""; $(".bt-plate.ally", c.el).style.opacity = "";
    c.anim(c.allyEl, [{ transform: "translateX(-90%)", opacity: 0 }, { transform: "none", opacity: 1 }], 480);
    await c.say("Go, " + nameOf(ally) + "!");
    await c.wait(350);
    let tries = 0, caught = false;
    if (auto) {
      await c.say("A Poké Ball flies out by itself! (catch chance " + Math.round(NET_CATCH * 100) + "%)", vo("A Poké Ball flies out by itself!"));
      const res = FORCE_CATCH === "1" ? { ok: true, shakes: 3 } : FORCE_CATCH === "0" ? { ok: false, shakes: 2 } : (() => { const ok = Math.random() < NET_CATCH; return { ok, shakes: ok ? 3 : 1 + Math.floor(Math.random() * 3) }; })();
      if (res.ok) {
        caught = true;
        if (!prof.collection.some(x => x.id === id)) prof.collection.push({ id, t: Date.now(), from: "wild" });
        prof.stats.wildCaught = (prof.stats.wildCaught || 0) + 1;
        Store.save();
      }
      await stageThrow(c, "poke", res);
      if (c.live() && res.ok) {
        await c.say("Gotcha! " + name + " was caught!", [vo("Gotcha!"), name, vo("was caught!")]);
        await c.wait(600);
        const swapped = c.live() ? await offerSwap(c, e, id) : false;
        G.net.note = "🌿 " + G.s.teams[e.team].name + " caught " + name + "!" + (swapped ? " 🔄 Swapped in as a piece" : "");
        if (!swapped) await c.say(name + " went to your Box! You can play with it next game.");
        await c.wait(700);
      }
    }
    // ③ 볼 고르기 → 던지기 (한 조우에 3번까지)
    while (c.live() && !auto) {
      const have = R.BALLS.filter(b => (prof.bag[b] || 0) > 0);
      if (!have.length) {
        await c.say("No balls in your Bag! Beat Team Rocket to get balls from a 🎁 chest.", [vo("No balls in your Bag!"), vo("Beat Team Rocket to get more!")]);
        await c.wait(1300);
        break;
      }
      if (tries >= R.THROWS) break;
      await c.say("Which ball will you throw? (" + (R.THROWS - tries) + (R.THROWS - tries === 1 ? " try" : " tries") + " left" + (tries ? " · +" + (tries * 10) + "% for misses" : "") + ")");
      const ball = await c.menu(have.map(b => ({
        key: b, cls: "bt-ballbtn",
        html: '<img src="assets/items/' + R.BALL_INFO[b].img + '.png" alt="">' + R.BALL_INFO[b].name + " <b>×" + prof.bag[b] + "</b><em" + (tries && b !== "master" ? ' class="up"' : "") + ">" + Math.round(R.catchRate(b, rar, tries) * 100) + "%</em>",
      })).concat([{ key: "leave", cls: "ghost", html: "Let it go" }]));
      if (!c.live()) break;
      if (!ball || ball === "leave") {
        await c.say(name + " went back to the grass. See you again! 👋");
        stageRunOff(c);
        await c.wait(1000);
        c.close();
        return;
      }
      // 결과를 먼저 정하고 곧바로 저장 — 연출 중에 패드를 꺼도 볼이 복사되거나 사라지지 않게
      const res = FORCE_CATCH === "1" ? { ok: true, shakes: 3 } : FORCE_CATCH === "0" ? { ok: false, shakes: 2 } : R.throwBall(ball, Math.random, rar, tries);
      prof.bag[ball] = Math.max(0, (prof.bag[ball] || 0) - 1);
      tries++;
      if (res.ok) {
        caught = true;
        if (!prof.collection.some(x => x.id === id)) prof.collection.push({ id, t: Date.now(), from: "wild" });
        prof.stats.wildCaught = (prof.stats.wildCaught || 0) + 1;
      }
      Store.save();
      renderBagChip();
      await c.say("Go, " + R.BALL_INFO[ball].name + "!", [vo("Go!"), R.BALL_INFO[ball].name]);
      await stageThrow(c, ball, res);
      if (!c.live()) break;
      if (res.ok) {
        await c.say("Gotcha! " + name + " was caught!", [vo("Gotcha!"), name, vo("was caught!")]);
        await c.wait(800);
        const swapped = c.live() ? await offerSwap(c, e, id) : false;
        if (netOn()) G.net.note = "🌿 " + G.s.teams[e.team].name + " caught " + name + "!" + (swapped ? " 🔄 Swapped in as a piece" : "");
        if (!swapped) await c.say(name + " went to your Box! You can play with it next game.");
        await c.wait(1100);
        break;
      }
      await c.say("Oh no! It broke free!" + (tries < R.THROWS ? " Next ball: +10% catch chance!" : ""));
      await c.wait(600);
    }
    if (!caught && c.live()) {
      if (c.live()) SFX.runHome();
      stageRunOff(c);
      await c.say(name + " ran away into the grass… See you next time!");
      if (netOn()) G.net.note = "🌿 " + name + " ran away from " + G.s.teams[e.team].name;
      await c.wait(auto ? 700 : 1000);
    }
    c.close();
  })().catch(err => { console.error(err); c.close(); });
  return c.done;
}

const WILD_POOLS = (() => { const p = { c: [], r: [], u: [], l: [] }; for (let id = 1; id <= 1025; id++) p[rarityOf(id)].push(id); return p; })();
// ❓ 풀숲 칸 2개 — 칸과 숨은 포켓몬을 판을 만들 때 정해 저장한다 (새로고침으로 다시 뽑기 불가). 테스트용 ?spots=3:133,12:58 · ?spots=none
function makeSpots(seed) {
  if (Q.get("spots") === "none") return []; // 테스트용: 풀숲 없이
  const forced = (Q.get("spots") || "").split(",").map(x => x.split(":").map(Number)).filter(x => x.length === 2 && Yut.NODES[x[0]] && x[1] >= 1 && x[1] <= 1025);
  if (forced.length) return forced.map(([node, id]) => ({ node, id }));
  // v4: 칸만 정해 두고 포켓몬은 멈춘 뒤에 뽑는다 (🕐 시계 문제를 맞히면 희귀도가 올라가서)
  return Yut.pickSpotNodes(Yut.rng((seed ^ 0x5eed) >>> 0), 2).map(node => ({ node, id: null }));
}
function startGame(teams, opts) {
  const seed = Q.get("seed") ? Number(Q.get("seed")) : (Math.floor(Math.random() * 2147483646) + 1);
  const lineRnd = Yut.rng((seed ^ 0xe7011) >>> 0);
  // 말의 진화 경로: 모두 마지막 모습까지 (로켓단도 — 또가스→또도가스, 나옹→페르시온. 처음부터 기술을 쓰면 불공평해서)
  teams = teams.map(t => Object.assign({}, t, { paths: t.picks.slice(0, opts.pieces).map(id => linePath(id, lineRnd)) }));
  // 기술 후보: 마지막 모습의 타입 기술, 모두 10칸에 배운다 (v8). 시험용 ?pools=nitro,surf|toxic,quake · ?early=1(모두 처음부터)
  const forcedPools = (Q.get("pools") || "").split("|").map(x => x.split(",").filter(k => Yut.SKILLS[k]));
  teams = teams.map((t, ti) => Object.assign({}, t, {
    early: t.paths.map(p => p.some(x => rarityOf(x) === "l")),
    now: t.paths.map(() => Q.get("early") === "1"),
    need: t.picks.slice(0, opts.pieces).map(id => skillNeedOf(id)),
    rar: Q.get("luck") === "1" ? undefined : t.picks.slice(0, opts.pieces).map(chanceRar),  // 🎲 기술 성공 확률 (v8). 시험용 ?luck=1 = 늘 성공
    types: t.paths.map(p => p.map(typesOf)),            // 상성 (단계별 타입)
    bases: t.paths.map((p, k) => Math.max(0, p.indexOf(t.picks[k]))), // 진화형을 골랐으면 그 모습부터 (사용자 요청 2026-09-28)
    pools: t.paths.map((p, k) => (forcedPools[ti] && forcedPools[ti][k]) ? [forcedPools[ti][k]] : poolFor(p[p.length - 1])),
  }));
  const s = Yut.newGame({
    pieces: opts.pieces, backdo: opts.backdo, seed, first: opts.first || 0, skills: opts.skills !== false,
    mode: opts.mode, cpuLevel: opts.cpuLevel, battle: opts.battle, teams, spots: makeSpots(seed),
  }, D.evoFrom);
  s.intro = true;
  if (Q.get("luck") === "1") s.luck = true;
  if (opts.mode === "net") s.settings.timer = opts.timer == null ? 20 : Number(opts.timer) || 0; // ⏱ 친구 대결 차례 타이머 (0 = 없음)
  s.settings.study = opts.study !== false; // 🎓 공부 문제 (화면 쪽 설정)
  G.s = s;
  G.net = opts.net ? { code: opts.net.code, me: opts.net.me, seq: 0, queue: [], running: false, remoteBusy: false, note: null, pid: opts.net.pid || Setup.t0, round: opts.net.round || 0, first: opts.net.first || 0 } : null;
  persist();
  netSend([], false); // 친구 대결: 판을 서버에 올린다 → 방 만든 집 패드도 윷판으로
  showScreen("game");
}

function markSeen(key) {
  if (!key || !Yut.SKILLS[key]) return;

function chipBadges(i) {
  const s = G.s, p = s.pieces[i];
  let h = "";

    h += '<span class="sk left" title="Move in ' + skillLeft(i) + (skillLeft(i) === 1 ? " space" : " spaces") + '">' + skillLeft(i) + "</span>"; // 기술까지 남은 칸
  }

      : '<span class="sk' + (Yut.isFinal(s, i) ? "" : " wait") + '" title="' + esc(skillName(p.skill)) + '">' + ((SKILL_UI[p.skill] || {}).emoji || "✨") + "</span>";

function teamFxHtml(ti) {
  const s = G.s, f = s.teams[ti].fx || {}, n = s.teams.length;
  const teamAt = t => (((s.turn + (t - s.turnNo)) % n) + n) % n;
  const left = until => { let c = 0; for (let t = s.turnNo; t <= until; t++) if (teamAt(t) === ti) c++; return c; };
  let h = "";
  if (f.poison) h += ' <span class="tfx" title="Next throw is Back-do">☠️</span>';
  if ((f.seal || 0) >= s.turnNo) h += ' <span class="tfx" title="Moves sealed">🔒' + left(f.seal) + "</span>";
  if ((f.rain || 0) >= s.turnNo) h += ' <span class="tfx" title="Rain">🌧️' + left(f.rain) + "</span>";
  if ((f.chill || 0) >= s.turnNo) h += ' <span class="tfx" title="Frozen — only Back-do, Do or Gae">🧊</span>';

}

function showSkillTargets(i, x) {
  const box = $("#dests");

  $$("#units .unit").forEach(el => el.classList.remove("can", "sel"));
  $$(".pchip").forEach(c => c.classList.remove("can", "selected", "target"));
  const team = G.s.pieces[i].team, u = Yut.unitOfPiece(G.s, i);
  const ring = (node, label, target, hit) => {
    const b = document.createElement("button");
    b.className = "dest skill-t" + (hit ? " hit" : "") + (nodeXY(node)[0] >= 50 ? " flip" : "");
    placeAt(b, node);
    b.dataset.node = node;

    b.addEventListener("click", ev => { ev.stopPropagation(); if (!G.busy && G.target) doSkill(i, target, x.slot); });
    box.appendChild(b);

  const chanceAt = tg => { const c = Yut.skillChance(G.s, i, x.key, tg); return " " + pctTxt(c.chance) + (c.match > 0 ? "💥" : c.match < 0 ? "💧" : ""); };
  if (x.target === "enemy") x.targets.forEach(n => ring(n, (TARGET_LABEL[x.key] || "") + chanceAt(n), n, x.key === "flame"));
  else if (x.target === "ally") x.targets.forEach(n => ring(n, TARGET_LABEL[x.key] || "", n, false));
  else if (x.target === "node") x.targets.forEach(n => ring(n, "", n, false)); // 빈 칸이 많아서 말풍선은 뺀다
  else if (x.target === "move") x.targets.forEach(r => {

    if (!d) return;
    const hit = Yut.piecesAt(G.s, d.node).some(j => G.s.pieces[j].team !== team);
    ring(d.node, RES[r].name + " ↩️" + (hit ? " Battle!" : ""), r, hit);

  else if (x.target === "enemyPiece") {
    const seen = {};
    x.targets.forEach(j => {
      const q = G.s.pieces[j];
      if (q.state === "board") {
        const n = Yut.posOf(q);
        if (!seen[n]) { seen[n] = 1; ring(n, TARGET_LABEL.snatch + " " + skillName(q.skill) + chanceAt(j), j, false); }
      } else { const c = $('.pchip[data-piece="' + j + '"]'); if (c) c.classList.add("target"); }
    });
  }
}

}

// 🎲 기술 성공·실패 보여 주기 (사용자 요청 2026-09-29): 성공 칸(초록)이 확률만큼, 바늘이 왔다 갔다 하다 멈춘다 → 성공! / 실패…
// 바늘 자리는 결과에 맞춰 성공이면 초록 안, 실패면 회색 안 (확률 감각 익히기). 누르면 넘김
function skillRoll(chance, ok, match, title) {
  return new Promise(res => {
    const pc = Math.round(chance * 100);
    const at = ok ? Math.random() * pc * 0.92 + pc * 0.04 : pc + (100 - pc) * (0.15 + Math.random() * 0.7);
    const el = document.createElement("div");
    el.className = "roll";
    el.innerHTML = '<div class="roll-card"><b class="roll-title">' + esc(title ? title + " · " : "") + "🎲 Success " + pc + "%" + (match > 0 ? " 💥" : match < 0 ? " 💧" : "") + "</b>" +
      '<div class="roll-bar"><i class="roll-win" style="width:' + pc + '%"></i><i class="roll-needle"></i></div>' +
      '<div class="roll-lab"><em class="g" style="width:' + pc + '%">Success ' + pc + "%</em>" + (pc < 100 ? '<em class="x">Miss ' + (100 - pc) + "%</em>" : "") + "</div>" +
      '<strong class="roll-res"></strong></div>';
    document.body.appendChild(el);
    const nd = el.querySelector(".roll-needle"), out = el.querySelector(".roll-res");
    let done = false;
    const close = () => { if (done) return; done = true; el.classList.add("out"); setTimeout(() => { el.remove(); res(); }, 200 * SPEED); };
    el.addEventListener("click", close);
    const sweep = pc >= 100 ? [{ left: "50%" }, { left: at + "%" }] : [{ left: "2%" }, { left: "98%" }, { left: "10%" }, { left: "90%" }, { left: at + "%" }];
    const a = nd.animate(sweep, { duration: 1000 * SPEED, easing: "cubic-bezier(.3,.1,.3,1)", fill: "forwards" });
    a.onfinish = () => {
      if (done) return;
      el.classList.add(ok ? "ok" : "no");
      out.textContent = ok ? "Success! ✨" : "Missed… 😵";
      if (ok) { SFX.again(); confetti(18); } else SFX.thud();
      setTimeout(close, 900 * SPEED);
    };
  });
}

const EVENT_ANIM = {

    if (e.match > 0 && e.ok !== false) { SFX.again(); toast("💥 It's super effective! (Success +10%)", 1500); await sleep(700); }
    else if (e.match < 0) { toast("💧 It's not very effective… (Success −10%)", 1500); await sleep(700); }
  },
  async skillfail(e, prev) {
    const st = prev || G.s, p = st.pieces[e.piece];
    if (p && p.state === "board") fxAt(Yut.posOf(p), "😵");
    SFX.thud();
    const msg = "Oh no! " + skillName(e.key) + " missed! (" + pctTxt(e.chance) + " chance)";
    toast("😵 " + msg + " This move is used up…", 2400);
    TTS.say("Oh no, it missed!");
    renderPanel();
    await sleep(1300);
  },
  async reactfail(e) {
    await skillRoll(e.chance, false, 0, (SKILL_UI[e.key] || {}).emoji + " " + skillName(e.key));
    const q = G.s.pieces[e.piece];
    if (q && q.state === "board") fxAt(Yut.posOf(q), "😵");
    SFX.thud();
    toast("😵 " + nameOf(Yut.formOf(G.s, e.piece)) + "'s " + (SKILL_UI[e.key] || {}).emoji + " " + skillName(e.key) + " missed! (" + pctTxt(e.chance) + " chance)", 1900);
    await sleep(900);

/* ---------- 🔄 말 바꾸기 — 잡은 포켓몬을 그 자리에 ---------- */
// 잡은 포켓몬의 말 정보: 1단계부터 마지막 모습까지(갈래는 무작위), 잡은 모습의 단계, 기술 후보, 기술 성공 확률·타입
function swapInfo(id) {
  const path = linePath(id, Math.random);
  const early = path.some(x => rarityOf(x) === "l");
  const forced = Q.get("swappool"); // 시험용
  return { id, path, base: Math.max(0, path.indexOf(id)), early, need: skillNeedOf(id), rar: chanceRar(id), types: path.map(typesOf), pool: forced && Yut.SKILLS[forced] ? [forced] : poolFor(path[path.length - 1]) };
}
// 조우 무대 안: "지금 말로 쓸까요?" → 바꿀 말 고르기 → "돌아와! 가라!"
async function offerSwap(c, e, id) {
  const s = G.s, team = e.team, root = rootOf(id), name = nameOf(id);
  const cands = s.pieces.map((p, i) => i).filter(i => s.pieces[i].team === team && Yut.swapOk(s, i, root));
  if (!cands.length) { await c.say("The " + nameOf(root) + " family is already on the board. It can't be a piece now."); await c.wait(900); return false; }
  if (!c.skip) TTS.say(["Use it as a piece now?", "Pick a piece to swap!"]);
  await c.say("Use " + name + " as a piece now? Pick a piece to swap!");
  const tag = i => { const p = s.pieces[i]; return p.skill && p.used ? " <em>✨ used</em>" : p.state === "wait" ? ' <em class="home">Home</em>' : ""; };
  const pick = await c.menu(cands.map(i => ({ key: String(i), cls: "bt-swapbtn", html: '<span class="sw-pic">' + spr(Yut.formOf(s, i)) + "</span>" + esc(nameOf(Yut.formOf(s, i))) + tag(i) }))
    .concat([{ key: "later", cls: "ghost", html: "Later (to Box)" }]));
  if (!pick || pick === "later" || !c.live()) return false;
  const i = Number(pick);
  const old = Yut.formOf(G.s, i);
  const r = Yut.applySwap(G.s, i, swapInfo(id));
  G.s = r.state;
  persist();
  await c.say("Come back, " + nameOf(old) + "!");
  if (e.pieces[0] === i && c.allyEl) { // 무대에 선 포켓몬이 바로 그 말이면 모습도 바꾼다
    await c.anim(c.allyEl, [{ transform: "none", opacity: 1, filter: "none" }, { transform: "scale(.2)", opacity: 0, filter: "brightness(3)" }], 420);
    c.allyEl.insertAdjacentHTML("afterend", btSprite(id, true, 27, 94, 33, "ally"));
    const nx = c.allyEl.nextElementSibling;
    c.allyEl.remove();
    c.allyEl = nx;
    await c.anim(c.allyEl, [{ transform: "scale(.2)", opacity: 0 }, { transform: "none", opacity: 1 }], 420);
    const plate = $(".bt-plate.ally b", c.el);
    if (plate) { plate.textContent = name; fitPlateName(plate); }
  }
  if (!c.skip) TTS.say(["Go!", name]);
  await c.say("Go, " + name + "! 🔄");
  await c.wait(700);
  G.swapAfter = { piece: i, events: r.events.slice(1), from: old, to: id };
  return true;
}
// 윷판에서 이어서: 바뀐 말 모습 → (이어받아) 진화 → 기술 배우기
async function afterSwapBoard(x) {
  const p = G.s.pieces[x.piece];
  let el = null;
  if (p.state === "board") {
    el = syncUnitAt(p.team, Yut.posOf(p));
    const ev = x.events.find(e => e.type === "evolve");
    const front = el && el.querySelector(".front");
    if (front && ev) front.innerHTML = spr(G.s.teams[p.team].paths[p.slot][ev.from], true);
    if (el) { el.classList.remove("stacked"); void el.offsetWidth; el.classList.add("stacked"); sparkle(Yut.posOf(p)); }
  }
  renderPanel();
  SFX.pop();
  toast("🔄 " + nameOf(x.from) + " → " + nameOf(x.to) + "! A new piece is here!", 1800);
  await sleep(900);
  G.lastEl = el;
  await playEvents(x.events, null);
}
// 😼 로켓단도 풀숲에서 그물로 잡아 자기 말로 (한 번, 60%) — 로켓단 보관함은 없다 (그 판에서만)
async function rocketNet(e) {
  const id = e.id, name = nameOf(id);
  fxAt(e.node, "🥅");
  SFX.throwBall();
  toast("😼 Team Rocket threw a net, meow! 🥅", 1400);
  TTS.say("Team Rocket threw a net, meow!");
  await sleep(1000);
  const ok = FORCE_CATCH === "1" ? true : FORCE_CATCH === "0" ? false : Math.random() < ROCKET_NET;
  const target = ok ? Yut.cpuSwapTarget(G.s, e.team, rootOf(id), e.pieces[0]) : null;
  if (!ok || target == null) {
    fxAt(e.node, "💨");
    SFX.runHome();
    toast(ok ? "Team Rocket caught " + name + "… but its family is already here. We let it go, meow!" : "The net broke, meow! " + name + " ran back into the grass 🌿", 2400);
    TTS.say(ok ? "We let it go, meow!" : "The net broke, meow!");
    await sleep(1400);
    return;
  }
  const old = Yut.formOf(G.s, target);
  const r = Yut.applySwap(G.s, target, swapInfo(id));
  G.s = r.state;
  persist();
  SFX.catchOk();
  fxAt(e.node, "😼");
  toast("😼 Team Rocket netted " + name + ", meow! " + nameOf(old) + " takes a rest and " + name + " comes out, meow~", 2800);

  await sleep(1200);
  G.swapAfter = { piece: target, events: r.events.slice(1), from: old, to: id };
}

// 🕐 시계 — 알록달록 숫자 1~12, 바깥 분 숫자 0·5·…·55, 1분 눈금 60개. 시침 = 짧은 빨강, 분침 = 긴 파랑
function clockSvg(h, m) {
  const pt = (deg, r) => { const a = (deg - 90) * Math.PI / 180; return [(Math.cos(a) * r).toFixed(2), (Math.sin(a) * r).toFixed(2)]; };
  let g = '<circle r="104" fill="#fff" stroke="#263147" stroke-width="6"/><circle r="97" fill="none" stroke="#dfeaf7" stroke-width="3"/>';
  for (let i = 0; i < 60; i++) {
    const big = i % 5 === 0, [x1, y1] = pt(i * 6, big ? 92 : 94), [x2, y2] = pt(i * 6, big ? 84 : 89);
    g += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + (big ? STUDY_COLORS[(i / 5) % 4] : "#9fb0c6") + '" stroke-width="' + (big ? 3 : 1.6) + '" stroke-linecap="round"/>';
  }
  for (let i = 0; i < 12; i++) {
    const [x, y] = pt(i * 30, 76);
    g += '<text x="' + x + '" y="' + y + '" class="ck-min" fill="' + STUDY_COLORS[i % 4] + '">' + (i * 5) + "</text>";
    const n = i === 0 ? 12 : i, [X, Y] = pt(i * 30, 54);
    g += '<text x="' + X + '" y="' + Y + '" class="ck-hr" fill="' + STUDY_COLORS[n % 4] + '">' + n + "</text>";
  }
  const hd = (h % 12) * 30 + m * 0.5, md = m * 6;
  g += '<g class="hand-m" transform="rotate(' + md + ')"><line x1="0" y1="10" x2="0" y2="-80" stroke="#2f6fd6" stroke-width="6" stroke-linecap="round"/></g>';
  g += '<g class="hand-h" transform="rotate(' + hd + ')"><line x1="0" y1="8" x2="0" y2="-44" stroke="#e5484d" stroke-width="11" stroke-linecap="round"/></g>';
  g += '<circle r="8" fill="#263147"/><circle r="3" fill="#fff"/>';
  return '<svg class="clock" viewBox="-110 -110 220 220" role="img" aria-label="Clock">' + g + "</svg>";
}
// 💰 놀이 돈 — 진짜 지폐를 베끼지 않는다. 단위마다 색·모양이 다른 지폐/수표/동전 + 큰 숫자

/* 문제 창 — kind: "clock" | "money". 누르면 { ok }. 틀리면 풀이를 보여 주고 "알겠어요!"를 눌러야 닫힌다 */
function quizWindow(o) {
  return new Promise(res => {
    const el = document.createElement("div");
    el.className = "quiz";
    el.innerHTML = '<div class="qz-card qz-' + o.kind + (o.scene ? " has-scene" : "") + '">' + (o.scene || "") +
      '<p class="qz-title">' + o.title + ' <span class="qz-lv">' + (o.step ? "Q " + o.step + "/" + (o.of || 3) + " · " : "") + "⭐".repeat(o.level) + " Level " + o.level + "</span></p>" +
      '<div class="qz-body">' + o.body + "</div>" +
      '<div class="qz-side"><p class="qz-q">' + o.question + "</p>" +
        '<div class="qz-choices">' + o.choices.map((c, k) => '<button class="btn qz-choice" data-k="' + k + '"' + (k === o.answer ? ' data-ok="1"' : "") + ">" + esc(c) + "</button>").join("") + "</div>" +
        '<div class="qz-explain" aria-live="polite"></div>' +
        '<button class="btn big green qz-next" hidden>Got it!</button></div>' +
      "</div>";
    document.body.appendChild(el);
    TTS.say(o.say || o.question); // o.say 는 조각 배열도 된다 (숫자는 따로)
    const btns = $$(".qz-choice", el), ex = $(".qz-explain", el), next = $(".qz-next", el);
    let done = false;
    const close = ok => { el.classList.add("out"); setTimeout(() => { el.remove(); res({ ok }); }, 220 * SPEED); };
    btns.forEach(b => b.addEventListener("click", async () => {
      if (done) return;
      done = true;
      const k = Number(b.dataset.k), ok = k === o.answer;
      btns.forEach(x => x.disabled = true);
      btns[o.answer].classList.add("right");
      if (ok) {
        SFX.catchOk();
        b.insertAdjacentHTML("beforeend", '<span class="qz-star">⭐</span>');
        ex.innerHTML = "<b>" + (o.okText || "Correct!") + "</b>";
        TTS.say(o.okSay || vo("Correct!")); // o.okSay = 말할 조각 배열 (okText 는 화면용)
        await sleep(1500);
        close(true);
        return;
      }
      b.classList.add("wrong");
      SFX.pop();
      TTS.say("Oops! Let's look together!");
      await sleep(500);
      const steps = o.explain();
      for (const st of steps) {
        if (st.hl) $$(st.hl, el).forEach(x => x.classList.add("pulse"));
        ex.insertAdjacentHTML("beforeend", "<p>" + st.text + "</p>");
        await sleep(1100);
      }
      next.hidden = false;
      next.focus();
      next.addEventListener("click", () => { SFX.tap(); close(false); }, { once: true });
    }));
  });
}
// 🕐 풀이 (영어판: 짧고 쉬운 문장 — "The short hand points to 3. … It's 3:45!")
function clockExplain(h, m) {
  const next = h === 12 ? 1 : h + 1, k = Math.floor(m / 5), extra = m % 5, num = k === 0 ? 12 : k;
  const hourText = m === 0 ? "The short <b class='hr'>red hand</b> points to <b>" + h + "</b>. → <b>" + h + " o'clock</b>"
    : "The short <b class='hr'>red hand</b> is between <b>" + h + "</b> and <b>" + next + "</b>. → It's still <b>" + h + "</b>!";
  const minText = m === 0 ? "The long <b class='mn'>blue hand</b> points to <b>12</b>. → <b>o'clock</b> (0 minutes)"
    : extra === 0 ? "The long <b class='mn'>blue hand</b> points to <b>" + num + "</b>. → " + num + " × 5 = <b>" + m + " minutes</b>"
    : "The long <b class='mn'>blue hand</b> is <b>" + extra + "</b> small " + (extra === 1 ? "mark" : "marks") + " past <b>" + (k * 5) + "</b>. → <b>" + m + " minutes</b>";
  return [{ hl: ".hand-h", text: hourText }, { hl: ".hand-m", text: minText }, { text: "It's <b>" + Yut.Study.clockText({ h, m }) + "</b>!" }];
}
// 🔊 시각을 녹음된 숫자 조각으로: 3:00 → ["3", "o'clock"] · 3:05 → ["3", "oh", "5"] · 3:45 → ["3", "45"]
const clockSay = c => c.m === 0 ? [String(c.h), vo("o'clock")] : c.m < 10 ? [String(c.h), vo("oh"), String(c.m)] : [String(c.h), String(c.m)];
// ❓ 풀숲: 시계 문제 세 번 (아래 clockQuiz) — 맞힌 수만큼 이번 조우의 유니크·전설 ↑
const QUIZ_TRIES = 3; // 틀리면 풀이를 보고 다음 문제로 — 세 문제까지 (사용자 요청 2026-09-27: 교육 효과)

// 맞히면 다음 단계, 틀리면 같은 단계의 다른 문제. 맞힐 때마다 이번 조우의 유니크·전설 +3 · +3 · +4% (금액 문제와 같은 표)

const CLOCK_QS = 3;
async function clockQuiz() {

function clockPick(lv) {
  const h = 1 + Math.floor(Math.random() * 12);

  if (lv === 2) return { h, m: [15, 30, 45][Math.floor(Math.random() * 3)] };
  let m; do { m = Math.floor(Math.random() * 60); } while (m % 5 === 0); // 1분 단위 (5의 배수가 아닌 분)

}
async function clockQuizOnce(step, lv, right) {

  const q = Yut.Study.clock(3, Math.random, forced);
  const od = moneyOdds(right);

    kind: "clock", level: lv, step, of: CLOCK_QS,
    title: "🕐 Clock quiz " + step + "/" + CLOCK_QS + " — " + ["o'clock", ":15 · :30 · :45", "minute by minute"][lv - 1] + "! Get it right: <b>Unique·Legendary +" + MONEY_BOOST[lv - 1] + "%</b>" +

// 🌿 풀숲 포켓몬을 이제 뽑는다 (시계를 맞힌 수만큼 유니크·전설 ↑ — 다 맞히면 40·20·20·20). 뽑은 즉시 저장 — 새로고침으로 다시 뽑기 불가
function rollSpot(e, right) {
  const sp = (G.s.spots || []).find(x => x.node === e.node);
  if (sp && sp.id) { e.id = sp.id; return e.id; }
  const other = (G.s.spots || []).map(x => x.id).filter(Boolean), owned = ownedSet(teamPid(e.team) || gamePid());
  let id, tries = 0;
  const odds = right ? moneyOdds(right) : null;
  e.odds = odds || Yut.Rewards.WILD_ODDS;
  do { id = Yut.Rewards.rollWild(WILD_POOLS, owned, Math.random, odds); } while (other.indexOf(id) >= 0 && ++tries < 10);
  if (sp) sp.id = id;
  e.id = id;
  persist();
  return id;
}
// 💰 보물상자 바닥: 돈 문제 → 볼 하나 더 (틀리면 풀이 보고 다음 문제로 — 세 문제까지, 두·세 번째에 맞히면 몬스터볼)

/* ================================================================
   v7: 🏠 친구 대결 — 초대방 + 코드 4자리 (Firebase REST · yutrooms/{코드})
   자기 차례인 패드가 계산해서 { state, last:{ events, busy, note } } 를 올리고, 다른 패드는 받아서 똑같이 연출한다
================================================================ */
const NET_DB = (Q.get("db") || "https://elglishmon-default-rtdb.asia-southeast1.firebasedatabase.app").replace(/\/+$/, "");
const ROOM_TTL = 24 * 60 * 60 * 1000; // 방은 하루
const Net = {
  es: null, poll: null, code: null, onRoom: null,
  url(code) { return NET_DB + "/yutrooms/" + code + ".json"; },
  async get(code) { const r = await fetch(this.url(code) + "?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw new Error("net " + r.status); return r.json(); },
  async send(code, method, data) {
    for (let k = 0; k < 5; k++) { // 끊기면 몇 번 다시
      try { const r = await fetch(this.url(code), { method, body: JSON.stringify(data) }); if (r.ok) return true; if (r.status === 401 || r.status === 403) throw new Error("denied"); }
      catch (e) { if (e.message === "denied") throw e; }
      await new Promise(res => setTimeout(res, 800 * (k + 1)));
    }
    throw new Error("net fail");
  },
  put(code, data) { return this.send(code, "PUT", data); },
  patch(code, data) { return this.send(code, "PATCH", data); },
  // 실시간 구독 (Firebase 스트리밍) + 4초마다 확인 (스트리밍이 막힌 곳에서도 되게)
  listen(code, onRoom) {
    this.stop();
    this.code = code; this.onRoom = onRoom;
    let pulling = false;
    const pull = async () => {
      if (pulling || this.code !== code) return;
      pulling = true;
      try { const room = await this.get(code); if (this.code === code && this.onRoom) this.onRoom(room); } catch (e) {}
      pulling = false;
    };
    this.pull = pull;
    try { this.es = new EventSource(this.url(code)); ["put", "patch"].forEach(t => this.es.addEventListener(t, () => pull())); } catch (e) { this.es = null; }
    this.poll = setInterval(pull, 4000);
    pull();
  },
  stop() { if (this.es) { try { this.es.close(); } catch (e) {} } this.es = null; clearInterval(this.poll); this.poll = null; this.code = null; this.onRoom = null; },
};
const netOn = () => !!(G.net && G.s && G.s.settings.mode === "net");

/* ================================================================
   👤 프로필 + 💾 저장 코드 (사용자 확정 2026-10-02)
   사람마다 이름 · 캐릭터(내 포켓몬 중 하나) · 잡은 포켓몬 · 볼 · 전적 · 공부 기록을 따로, 저장 코드도 프로필마다 하나 (숫자 6자리)
   한 번 켜면 저절로 저장 · 다른 패드에서 코드로 불러오면 그 프로필이 생긴다(같은 프로필이 있으면 "불러오기"를 써서 바꾸기)
   같은 프로필을 패드 두 대에서: 잡은 포켓몬은 합치고, 볼·전적·공부 기록은 나중에 저장된 쪽
   서버 yutsaves/{코드} = { v: 2, updated, dataJ } — dataJ 는 프로필 JSON 글자 (Firebase 가 빈 배열을 지워서). 하고 있던 판은 안 올린다
================================================================ */
const PROF_KEYS = ["name", "avatar", "collection", "bag", "stats", "study"];
const Cloud = {
  timer: null, busy: false, again: false, pulled: 0,
  url(code) { return NET_DB + "/yutsaves/" + code + ".json"; },
  async req(code, opt) {
    const r = await fetch(this.url(code) + (opt ? "" : "?t=" + Date.now()), opt || { cache: "no-store" });
    if (r.status === 401 || r.status === 403) throw new Error("denied");
    if (!r.ok) throw new Error("net " + r.status);
    return r.json();
  },
  get(code) { return this.req(code); },
  put(code, body) { return this.req(code, { method: "PUT", body: JSON.stringify(body), keepalive: true }); },
  pick(p) { const o = { id: p.id }; PROF_KEYS.forEach(k => { o[k] = p[k]; }); if (p.cloud && p.cloud.rid) o.rid = p.cloud.rid; return o; }, // rid: 🥇 랭킹 번호 — 패드를 바꿔도 같은 줄
  parse(room) { try { const x = JSON.parse(room.dataJ); return x && typeof x === "object" && x.id && x.name ? x : null; } catch (e) { return null; } },
};
const hashStr = t => { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return h; };
const profHash = p => hashStr(JSON.stringify(Cloud.pick(p)));
// 잡은 포켓몬은 합친다 — 같은 포켓몬은 먼저 잡은 때로, 잡은 순서대로
function mergeCollection(a, b) {
  const by = {};
  [].concat(a || [], b || []).forEach(x => { if (!x || !(x.id >= 1 && x.id <= 1025)) return; if (!by[x.id] || (x.t || 0) < (by[x.id].t || 0)) by[x.id] = x; });
  return Object.values(by).sort((p, q) => (p.t || 0) - (q.t || 0));
}
// 받은 프로필을 이 패드에: replace = 이 패드 것을 버리고 · 아니면 잡은 포켓몬만 합치고 나머지는 받은 것
function applyCloud(x, replace, code, at) {
  const P = Store.data.profiles, old = P[x.id];
  const o = normProfile(Object.assign({}, x, { collection: replace || !old ? x.collection : mergeCollection(old.collection, x.collection) }), x.id);
  o.cloud = { code, at, rid: x.rid || (old && old.cloud && old.cloud.rid) || null };
  const nx = normProfile(x, x.id); nx.cloud = { rid: o.cloud.rid }; // 서버에 있는 그대로 — 합쳐서 달라졌으면 다시 올린다
  o.cloud.sent = hashStr(JSON.stringify(Cloud.pick(nx)));
  P[x.id] = o;
  if (Store.data.order.indexOf(x.id) < 0) Store.data.order.push(x.id);
  Store.save();
  return o;
}
const cloudProfs = () => Store.data && Store.data.profiles ? Object.values(Store.data.profiles).filter(p => p.cloud && p.cloud.code) : [];
function cloudSchedule(now) {
  if (!cloudProfs().some(p => profHash(p) !== p.cloud.sent)) return; // 바뀐 게 없음
  clearTimeout(Cloud.timer);
  Cloud.timer = setTimeout(cloudPush, now ? 0 : 4000);
}
async function pushOne(p) {
  const c = p.cloud;
  Rank.rid(p); // 랭킹 번호가 없으면 만들어서 저장에 같이
  try {
    const room = await Cloud.get(c.code);
    if (room && (room.updated || 0) > (c.at || 0)) { // 그사이 다른 패드가 저장했으면 잡은 포켓몬은 합친다
      const x = Cloud.parse(room);
      if (x) p.collection = mergeCollection(p.collection, x.collection);
    }
    const j = JSON.stringify(Cloud.pick(p)), at = Date.now();
    await Cloud.put(c.code, { v: 2, updated: at, dataJ: j });
    Object.assign(c, { at, sent: hashStr(j), err: null });
    await Rank.push(p); // 🥇 랭킹 숫자도 같이 (저장 코드와는 다른 번호로)
  } catch (e) {
    c.err = e.message === "denied" ? "denied" : "net";
    if (e.message !== "denied") setTimeout(() => cloudSchedule(true), 30000); // 인터넷이 돌아오면 다시
  }
}
async function cloudPush() {
  Cloud.timer = null;
  if (Cloud.busy) { Cloud.again = true; return; }
  Cloud.busy = true;
  for (const p of cloudProfs()) if (profHash(p) !== p.cloud.sent) await pushOne(p);
  Store.save();
  Cloud.busy = false;
  if (Cloud.again) { Cloud.again = false; cloudSchedule(true); }
  renderSaveInfo();
}
async function cloudPull() {
  if (Cloud.busy || Date.now() - Cloud.pulled < 15000) return;
  const list = cloudProfs();
  if (!list.length) return;
  Cloud.pulled = Date.now();
  let changed = false;
  for (const p of list) {
    try {
      const room = await Cloud.get(p.cloud.code);
      if (!room || (room.updated || 0) <= (p.cloud.at || 0)) continue;
      const x = Cloud.parse(room);
      if (!x || x.id !== p.id) continue;
      const mine = p.collection.length;
      const o = applyCloud(x, false, p.cloud.code, room.updated);
      changed = true;
      if (o.collection.length > mine) toast("💾 " + o.name + ": Pokémon caught on the other tablet are here too!", 2200);
    } catch (e) { /* 다음에 */ }
  }
  if (changed && current === "profiles" && !$("#overlay").classList.contains("show")) showScreen("profiles"); // 창이 열려 있으면 그대로
}
window.addEventListener("online", () => cloudSchedule(true));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && Cloud.timer) { clearTimeout(Cloud.timer); cloudPush(); } });
const agoText = t => { if (!t) return "not yet"; const m = Math.floor((Date.now() - t) / 60000), d = Math.floor(m / 1440); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.floor(m / 60) + " hr ago" : d + (d === 1 ? " day ago" : " days ago"); };
const codeBoxes = (code, id) => '<div class="net-code save-code"' + (id ? ' id="' + id + '"' : "") + ">" + [0, 1, 2, 3, 4, 5].map(k => "<b>" + esc((code || "")[k] || "") + "</b>").join("") + "</div>";
const bagCount = b => Yut.Rewards.BALLS.reduce((t, k) => t + ((b || {})[k] || 0), 0);
const ballCountText = n => n + (n === 1 ? " ball" : " balls");
const profLine = p => { const g = (p.stats || {}).games || 0; return "📕 " + (p.collection || []).length + " Pokémon · 🎒 " + ballCountText(bagCount(p.bag)) + " · " + g + (g === 1 ? " game" : " games"); };
const DENIED = "⚠️ The server isn't ready yet — a grown-up needs to add yutsaves to the Firebase rules";
function renderSaveInfo() {
  const box = $("#save-info");
  if (!box) return;
  const p = Store.data.profiles[box.dataset.id], c = p && p.cloud;
  if (!c) return;
  box.innerHTML = c.err === "denied" ? esc(DENIED)
    : c.err === "net" ? "📶 No internet, so it isn't saved yet. It saves by itself when the internet is back"
    : Cloud.busy || Cloud.timer ? "💾 Saving…" : "✅ Last saved: " + agoText(c.at);
}

/* ================================================================
   🥇 랭킹 (사용자 확정 2026-10-02: 모두 — 💾 저장 코드를 켠 프로필끼리, 친구네 포함)
   서버 yutrank/{랭킹 번호 10글자} = { name, avatar, mons, legends, wins, updated }
   — 저장 코드는 넣지 않는다 (랭킹 목록은 누구나 읽으니까, 코드가 보이면 남이 기록을 불러갈 수 있음)
   필터: 📕 잡은 포켓몬 수 · 👑 전설 수 · 🏆 이긴 수 (가족 + 로켓단 + 친구 대결)
================================================================ */
const RANK_BY = [
  { k: "mons", label: "📕 Pokémon", unit: " Pokémon" },
  { k: "legends", label: "👑 Legendary", unit: " Pokémon" },
  { k: "wins", label: "🏆 Wins", unit: " wins", one: " win" },
];
const rankOf = p => ({
  name: p.name, avatar: p.avatar,
  mons: (p.collection || []).length,
  legends: (p.collection || []).filter(x => isLegend(x.id)).length,
  wins: ["family", "rocket", "net"].reduce((t, k) => t + (((p.stats || {})[k] || {}).win || 0), 0),
  updated: Date.now(),
});
const Rank = {
  url(rid) { return NET_DB + "/yutrank" + (rid ? "/" + rid : "") + ".json"; },
  rid(p) { // 랭킹 번호 (처음 저장할 때 만든다)
    if (!p.cloud) return null;
    if (!p.cloud.rid) { const a = "abcdefghijklmnopqrstuvwxyz0123456789"; p.cloud.rid = Array.from({ length: 10 }, () => a[Math.floor(Math.random() * a.length)]).join(""); }
    return p.cloud.rid;
  },
  async push(p) {
    const rid = this.rid(p);
    if (!rid) return;
    try { const r = await fetch(this.url(rid), { method: "PUT", body: JSON.stringify(rankOf(p)), keepalive: true }); p.cloud.rankErr = r.ok ? null : r.status; }
    catch (e) { p.cloud.rankErr = "net"; }
  },
  remove(p) { if (p && p.cloud && p.cloud.rid) fetch(this.url(p.cloud.rid), { method: "DELETE", keepalive: true }).catch(() => {}); },
  async list() {
    const r = await fetch(this.url() + "?t=" + Date.now(), { cache: "no-store" });
    if (r.status === 401 || r.status === 403) throw new Error("denied");
    if (!r.ok) throw new Error("net");
    const o = (await r.json()) || {};
    return Object.keys(o).map(rid => Object.assign({ rid }, o[rid])).filter(x => x && x.name && typeof x.mons === "number");
  },
};
let rankRows = null, rankErr = null;

    Store.save();

const netParse = j => { try { return typeof j === "string" ? JSON.parse(j) : null; } catch (e) { return null; } };
function netSave() { if (G.net) { Store.data.net = G.s && G.s.phase === "over" ? null : { code: G.net.code, me: G.net.me, seq: G.net.seq, pid: G.net.pid, round: G.net.round || 0, first: G.net.first || 0 }; Store.save(); } } // 끝난 판은 이어하기에서 빼기
// 내 동작을 올린다 — busy: 아직 연출·조우·선물 고르기 중 (상대는 기다린다)
let netChain = Promise.resolve();
function netSend(events, busy) {
  if (!netOn()) return;
  G.net.seq++;
  const st = JSON.parse(JSON.stringify(G.s));
  delete st.reward; delete st.recorded; delete st.intro;
  const note = G.net.note || null;
  G.net.note = null;
  // 판 상태·연출은 JSON 글자로 — Firebase 는 빈 배열·null 을 지워 버려서 그대로 올리면 판이 망가진다
  const payload = { seq: G.net.seq, stateJ: JSON.stringify(st), status: st.phase === "over" ? "over" : "play", updated: Date.now(),
    lastJ: JSON.stringify({ seq: G.net.seq, by: G.net.me, events: events || [], busy: !!busy, note }) };
  netSave();
  const code = G.net.code;
  netChain = netChain.then(() => Net.patch(code, payload)).catch(e => { console.error(e); toast("📶 The internet is down. We'll go on when it's back", 2600); });
}
const giftMine = () => !!(netOn() && G.s.gifts && G.s.gifts.length && G.s.gifts[0].team === G.net.me);
// 상대 동작을 받는다 — 차례대로 연출
function onNetRoom(room) {
  if (!netOn() || current !== "game" || !room) return;
  onEmote(room.emote);
  if ((room.round || 0) > (G.net.round || 0)) { netRematchEnter(room); return; } // 🔁 같은 친구와 한 판 더
  if ((room.seq || 0) <= G.net.seq) return;
  G.net.seq = room.seq;
  netSave();
  const L = netParse(room.lastJ) || {};
  const st = fillV8(netParse(room.stateJ));
  if (L.by === G.net.me || !st) return;
  G.net.queue.push({ state: st, last: L });
  netDrain();
}
async function netDrain() {
  if (G.net.running) return;
  G.net.running = true;
  while (G.net.queue.length && current === "game") {
    if (G.busy) { await new Promise(r => setTimeout(r, 120)); continue; }
    const x = G.net.queue.shift();
    const prev = G.s;
    G.s = Object.assign(x.state, { reward: prev.reward, recorded: prev.recorded }); // 보상 기록은 내 패드 것
    G.net.remoteBusy = !!x.last.busy;
    persist();
    if (x.last.events && x.last.events.length) {
      G.busy = true; renderTop();
      try { await playEvents(x.last.events, prev); } catch (e) { console.error(e); }
      G.busy = false;
    }
    if (x.last.note) toast(x.last.note, 2600);
    afterAction();
  }
  G.net.running = false;
}
function netStartGame() { // 게임 화면에 들어갈 때 (새 판 · 이어하기)
  if (!netOn()) return;
  timerStart();
  G.net.queue = G.net.queue || []; G.net.running = false;

}

/* ---------- ⏱ 친구 대결 차례 타이머 (사용자 확정 2026-09-29: 20초 · 10초 · 없음, 처음엔 20초)

 * 던지기 → 던진다 · 말 고르기 → 가장 좋은 칸 · 말 바꾸기 → 나중에 · 넘겨주기 → 알아서 */
const TurnTimer = { left: null, id: null };
const timerLimit = () => (netOn() && G.s && G.s.settings.timer) || 0;
function timerWaiting() {
  if (!netOn() || current !== "game" || !G.s || G.s.phase === "over" || G.net.remoteBusy) return null;
  if ($(".battle .bt-menu [data-key='later']")) return "swap";
  if ($(".modal .gift-pick")) return "gift";
  if (G.s.turn !== G.net.me || G.busy || $(".coin-ov")) return null;
  return humanTurn() ? G.s.phase : null;
}
function timerTick() {
  const lim = timerLimit(), el = $("#turn-timer");
  const w = lim ? timerWaiting() : null;
  if (!w) { TurnTimer.left = null; TurnTimer.w = null; if (el) el.hidden = true; return; }
  if (TurnTimer.left == null || TurnTimer.w !== w) { TurnTimer.left = lim; TurnTimer.w = w; }
  else TurnTimer.left--;
  if (el) { el.hidden = false; el.textContent = "⏱ " + Math.max(0, TurnTimer.left); el.classList.toggle("hurry", TurnTimer.left <= 5); }
  if (TurnTimer.left <= 0) { TurnTimer.left = null; TurnTimer.w = null; timeUp(w); }
}
function timeUp(w) {
  toast("⏱ Time's up! I'll do it for you", 1600);

  if (w === "gift") { const b = $(".modal .gift-pick"); if (b) b.click(); return; }
  if ($("#overlay").classList.contains("show")) { modalClose = null; closeModal(); G.paused = false; }
  G.target = null;
  if (G.s.phase === "throw") { doThrow(); return; }
  if (G.s.phase === "choose") {
    const m = Yut.cpuChoose(G.s, "hard");
    if (m) { G.moves = Yut.legalMoves(G.s); if (m.unit === "new") G.newPick = null; doMove(m.id); }
  }
}
function timerStart() {
  clearInterval(TurnTimer.id);
  TurnTimer.left = null;
  if (!timerLimit()) return;
  if (!$("#turn-timer")) { const t = document.createElement("div"); t.id = "turn-timer"; t.hidden = true; document.body.appendChild(t); }
  TurnTimer.id = setInterval(timerTick, 1000 * Math.max(SPEED, 0.05));

/* ---------- 🔁 같은 친구와 한 판 더 (사용자 요청 2026-10-04) — 같은 방에서 바로, 먼저 고르는 집은 판마다 번갈아 ---------- */
async function netRematch() {
  if (!G.net || !G.s || G.s.phase !== "over" || G.net.rematching) return;
  G.net.rematching = true;
  const btn = $("[data-act=net-rematch]");
  if (btn) btn.disabled = true;
  try {
    const room = await Net.get(G.net.code);
    if (!room || !room.guest) throw new Error("gone");
    if ((room.round || 0) > (G.net.round || 0)) { netRematchEnter(room); return; } // 친구가 먼저 눌렀음
    const round = (room.round || 0) + 1, first = 1 - (room.first || 0);
    await Net.patch(G.net.code, { round, first, status: "pick-first", picks: null, stateJ: null, lastJ: null, seq: 0, updated: Date.now() });
    netRematchEnter(Object.assign({}, room, { round, first, status: "pick-first", picks: null }));
  } catch (e) {
    console.error(e);
    G.net.rematching = false;
    if (btn) btn.disabled = false;
    toast("📶 Couldn't get back into the room. Check the internet", 2600);
  }
}
function netRematchEnter(room) {
  const me = G.net.me, code = G.net.code, round = room.round || 0, first = room.first || 0;
  const st = room.settings || {};
  Object.assign(Setup, { mode: "net", pieces: st.pieces || Setup.pieces, backdo: st.backdo !== false, skills: st.skills !== false, battle: st.battle !== false, timer: st.timer == null ? 20 : st.timer });
  Setup.t0 = G.net.pid || Setup.t0;
  Setup.net = { code, me, round, first, names: [room.host.name, room.guest.name], avatars: [room.host.avatar || null, room.guest.avatar || null] };
  G.net = null; G.s = null;
  Store.data.game = null; Store.data.net = null; Store.save();
  toast("🔁 Play again! " + (first === me ? "We pick first this time" : Setup.net.names[first] + " picks first"), 2200);
  if (first === me) { Setup.ti = me; Setup.picks = [[], []]; Setup.picks[me] = validPicks(Store.data.lastPicks[Setup.t0], me); showScreen("pick"); }
  else { Setup.net.stage = "first-pick"; showScreen("netwait"); }
}
function netLeave() {

const Update = { at: 0, ver: null, told: null };
async function checkUpdate(force) {
  if (!navigator.onLine || !/^https?:$/.test(location.protocol)) return; // file:// 은 건너뜀
  if (!Update.ver && (force || Date.now() - Update.at > 60000)) {
    Update.at = Date.now();
    try {
      const r = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
      if (r.ok) { const m = /APP_VERSION\s*=\s*"([^"]+)"/.exec(await r.text()); if (m && m[1] !== APP_VERSION) Update.ver = m[1]; }
    } catch (e) { /* 오프라인이면 조용히 */ }
  }
  if (Update.ver) tellUpdate();
}
function tellUpdate() {
  if (current !== "home") return; // 판 · 고르기 · 친구 대결 중에는 기다렸다가 처음 화면에서
  const box = $(".menu-small");
  if (box && !$("#upd-btn")) box.insertAdjacentHTML("afterbegin", '<button class="btn gold upd-btn" id="upd-btn" data-act="app-update">🎁 Get the new version</button>');
  const f = $(".ver");
  if (f) f.textContent = "v" + APP_VERSION + " → new v" + Update.ver;
  if (Update.told === Update.ver || $("#overlay").classList.contains("show")) return;
  Update.told = Update.ver;
  showModal(
    '<h2>🎁 New version!</h2><p>You have <b>v' + esc(APP_VERSION) + "</b> now.<br>Change to the new <b>v" + esc(Update.ver) + "</b>?<br><small>Your game and caught Pokémon stay safe</small></p>" +
    '<div class="btns"><button class="btn big green" data-act="app-update">🔄 Get the new version</button><button class="btn" data-act="close-modal">Later</button></div>'
  );
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
window.addEventListener("online", () => checkUpdate(true));
setInterval(() => checkUpdate(), 10 * 60000);

/* ================================================================
   시작
================================================================ */
Store.load();
Object.assign(Setup, {
  t0: Store.data.settings.t0, t1: Store.data.settings.t1, cpu: Store.data.settings.cpu,
  pieces: Store.data.settings.pieces, backdo: Store.data.settings.backdo, battle: Store.data.settings.battle !== false,
  skills: Store.data.settings.skills !== false, study: Store.data.settings.study !== false,
});
if (Setup.t0 === Setup.t1) Setup.t1 = Store.data.order.find(id => id !== Setup.t0) || null;
TTS.init();
Art.load();
showScreen("home");
window.__yut = { G, Store, Art, Setup, Yut, Act }; // 테스트용
</script>
