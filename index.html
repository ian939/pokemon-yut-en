<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pokémon Yutnori">
<meta name="theme-color" content="#5bb8ff">
<link rel="icon" href="assets/ui/icon-180.png">
<link rel="apple-touch-icon" href="assets/ui/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Pokémon Yutnori</title>
<!--
  포켓몬 윷놀이 — 스타팅 포켓몬 + ❓ 풀숲에서 잡은 포켓몬이 말이 되는 가족 윷놀이 (개인·가정용 비상업 팬 프로젝트)
  - 규칙: yut-rules.js · 데이터: data/pokemon.js (tools 로 생성) · 그림: assets/
  - file:// 로 열어도 동작. 저장은 윷놀이 것(localStorage engmon_yut_v1)만 쓴다 — 잉글리시몬 저장은 읽지도 쓰지도 않는다.
-->
<script src="lock.js"></script>
<style>
/* ===== 패드 터치 잠금 (pad-input-lock 스킬) — 스타일시트 맨 위 ===== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; /* 안드로이드 가로에서 글자를 저절로 키우지 않게 */
  touch-action: pan-x pan-y; overscroll-behavior: none;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
}
input, textarea, [contenteditable] {
  -webkit-touch-callout: default; -webkit-user-select: text; user-select: text; touch-action: auto;
}

/* ===== 글꼴 — 갈무리11: 닌텐도 DS 한글 글꼴을 바탕으로 한 도트 글꼴 (SIL OFL, assets/fonts/OFL.md)
   11px 격자로 만든 글꼴이라 22·33·44·66·88px 로만 쓴다 (그 사이 크기는 획이 뭉개진다) ===== */
@font-face { font-family: "Galmuri11"; src: url(assets/fonts/galmuri11.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Galmuri11"; src: url(assets/fonts/galmuri11-bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }

/* ===== 디자인 토큰 — "DS 포켓몬 대화창 × 오방색 윷놀이"
   모든 창·버튼은 DS 대화창처럼 먹선 테두리 + 안쪽 흰 선. 팀 색은 윷놀이 말처럼 적(첫 팀)·청(두 번째 팀) ===== */
:root {
  --ink: #263147;       /* 먹 — 창 테두리·글자 */
  --ink-soft: #56627c;
  --paper: #fdfeff;     /* 창 안 */
  --paper-2: #dfeaf7;   /* 창 안쪽 선·빈 칸 */
  --sky: #cfe5fa;       /* 메뉴 바탕 */
  --red: #e5484d;       /* 적 — 첫 팀 (지온이) */
  --blue: #2f6fd6;      /* 청 — 두 번째 팀 */
  --gold: #f5b82e;      /* 황 — 고른 것·도착할 칸 */
  --green: #2fa35a;     /* 다음·시작 */
  --violet: #7a4fb5;    /* 로켓단 */
  --pixel: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  --win: inset 0 0 0 3px #fff, inset 0 0 0 5px var(--paper-2);   /* 먹선 안쪽의 흰 선 + 옅은 선 */
  --lift: 0 5px 0 rgba(38,49,71,.3);
  --t1: 22px; --t2: 33px; --t3: 44px; --t4: 66px; --t5: 88px;  /* 도트 글자 크기 (11의 배수) */
  --spd: 1;
}
@media (max-width: 640px), (max-height: 600px) {
  :root { --t2: 22px; --t3: 33px; --t4: 44px; --t5: 66px; }
}
* { margin: 0; padding: 0; }
body { font-family: var(--font); color: var(--ink); background: var(--sky); word-break: keep-all; overflow-wrap: anywhere; } /* 한국어는 띄어쓰기에서만 줄바꿈 */
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
img { -webkit-user-drag: none; }
#app { position: fixed; inset: 0; }
.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 24px; }
/* 메뉴 바탕: DS 메뉴처럼 옅은 사선 무늬 */
.setup, .pick, .game { background: var(--sky) repeating-linear-gradient(135deg, rgba(255,255,255,.42) 0 14px, rgba(255,255,255,0) 14px 28px); }

/* ===== 버튼 — 먹선 테두리 + 아래로 눌리는 그림자 ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
  min-height: 52px; min-width: 52px; padding: 8px 18px;
  font-family: var(--pixel); font-weight: 700; font-size: var(--t1); line-height: 1.2; color: var(--ink);
  background: var(--paper); border: 3px solid var(--ink); border-radius: 12px;
  box-shadow: inset 0 -4px 0 rgba(38,49,71,.14), 0 4px 0 var(--ink);
  transition: transform .06s, box-shadow .06s;
}
.btn:active { transform: translateY(4px); box-shadow: inset 0 -2px 0 rgba(38,49,71,.14), 0 0 0 var(--ink); }
.btn:focus-visible, .chip:focus-visible, .pcard:focus-visible, .pchip:focus-visible, .dest:focus-visible, .slot:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
.btn.big { min-height: 66px; width: 100%; padding: 8px 22px; border-radius: 14px; }
.btn.big small { display: block; width: 100%; font-family: var(--font); font-size: 14px; font-weight: 700; opacity: .92; }
.btn.red { background: var(--red); color: #fff; }
.btn.blue { background: var(--blue); color: #fff; }
.btn.violet { background: var(--violet); color: #fff; }
.btn.green { background: var(--green); color: #fff; }
.btn.gold { background: var(--gold); color: var(--ink); }
.btn.ghost { background: rgba(253,254,255,.94); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn.icon { width: 52px; height: 52px; min-height: 52px; padding: 0; font-size: 24px; }
/* DS 메뉴 커서 — 지금 누를 곳에만 */
.cursor::before { content: "▶"; font-family: var(--pixel); margin-right: -2px; animation: blink 1s steps(1) infinite; }

.bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; min-height: 68px; }
.bar h2 { flex: 1; text-align: center; font-family: var(--pixel); font-size: var(--t2); font-weight: 700; line-height: 1.1; }
.bar .side { width: 52px; text-align: center; font-family: var(--pixel); font-weight: 700; font-size: var(--t1); }

/* ===== 처음 화면 ===== */
.home { background: linear-gradient(#86ceff, #d7f1ff 52%, #a6e08a 53%, #6fc25a); }
.art-title .home { background: #86ceff url(assets/ui/title-bg.webp) center 70% / cover no-repeat; }
.home .inner { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 16px; padding: 14px; overflow-y: auto; }
/* 제목: 포켓몬 로고의 노랑·파랑을 도트 글꼴로 — 먹선은 4px 계단 그림자로 또렷하게 */
.logo {
  font-family: var(--pixel); font-weight: 700; font-size: var(--t5); line-height: 1; text-align: center; color: #ffcb05;
  text-shadow: 4px 0 0 #2a5fa8, -4px 0 0 #2a5fa8, 0 4px 0 #2a5fa8, 0 -4px 0 #2a5fa8, 4px 4px 0 #2a5fa8, -4px 4px 0 #2a5fa8, 4px -4px 0 #2a5fa8, -4px -4px 0 #2a5fa8, 0 10px 0 var(--ink);
}
.logo small { display: block; font-size: var(--t2); color: #fff; margin-bottom: 10px; text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 0 6px 0 rgba(38,49,71,.5); }
.cast { display: flex; gap: clamp(2px, 1.2vmin, 12px); align-items: flex-end; }
.cast .c { width: clamp(56px, 10vmin, 100px); text-align: center; }
.cast img { width: 100%; display: block; filter: drop-shadow(0 4px 0 rgba(38,49,71,.25)); animation: bob 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * -.45s); }
.cast b { display: inline-block; margin-top: 4px; min-width: 44px; white-space: nowrap; background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; padding: 2px 8px; font-family: var(--pixel); font-weight: 700; font-size: var(--t1); box-shadow: 0 3px 0 var(--ink); }
.menu { width: min(440px, 100%); display: grid; gap: 12px; padding: 16px; background: var(--paper); border: 4px solid var(--ink); border-radius: 18px; box-shadow: var(--win), var(--lift); }
.menu-small { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.ver { position: absolute; bottom: calc(8px + env(safe-area-inset-bottom)); right: 12px; font-family: var(--pixel); font-size: 11px; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); padding: 2px 8px; border-radius: 8px; }

/* ===== 준비 ===== */
.card { background: var(--paper); border: 4px solid var(--ink); border-radius: 18px; box-shadow: var(--win), var(--lift); padding: 20px 22px; margin: 4px auto 18px; width: min(720px, calc(100% - 24px)); }
.card h3 { font-family: var(--pixel); font-size: var(--t1); font-weight: 700; margin: 18px 0 10px; }
.card h3:first-child { margin-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { min-height: 52px; padding: 6px 16px; border-radius: 12px; background: var(--paper); border: 3px solid var(--ink); font-family: var(--pixel); font-weight: 700; font-size: var(--t1); box-shadow: 0 3px 0 var(--ink); }
.chip:active { transform: translateY(3px); box-shadow: none; }
.chip.on { background: var(--c, var(--gold)); color: #fff; }
.chip.on.plain { color: var(--ink); }
.chip.on::before { content: "▶ "; }
.chip[disabled] { opacity: .3; pointer-events: none; }
.card-actions { width: min(720px, calc(100% - 24px)); margin: 0 auto; }

/* ===== 포켓몬 고르기 — 포켓몬 PC 박스처럼 ===== */
.pick .bar .side { color: var(--tc); }
.slots { display: flex; gap: 10px; justify-content: center; padding: 2px 12px 10px; flex-wrap: wrap; }
.slot { position: relative; width: min(120px, 22vw); height: 128px; border-radius: 14px; border: 3px dashed var(--ink-soft); background: rgba(253,254,255,.55); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.slot.empty span { font-family: var(--pixel); font-size: var(--t2); color: var(--ink-soft); }
.slot.filled { border: 4px solid var(--ink); background: var(--paper); box-shadow: inset 0 6px 0 var(--tc), var(--lift); }
.slot .pic { position: relative; width: 64px; height: 64px; }
.slot .nm { font-size: 14px; font-weight: 800; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.slot .evo { display: flex; align-items: center; gap: 1px; height: 26px; font-size: 11px; color: var(--ink-soft); font-weight: 800; }
.slot .evo .mini { position: relative; width: 24px; height: 24px; }
.slot .evo b { font-size: 13px; font-weight: 900; color: var(--ink); }
.slot .x { position: absolute; top: -12px; right: -12px; width: 30px; height: 30px; border-radius: 8px; background: var(--paper); border: 3px solid var(--ink); font-size: 13px; font-weight: 900; display: grid; place-items: center; }
.pick-actions { display: flex; gap: 12px; justify-content: center; padding: 0 12px 12px; }
.pick-actions .btn { flex: 1; max-width: 300px; }
.grid-wrap { width: min(980px, calc(100% - 20px)); margin: 0 auto; }
/* 지역 이름은 박스 이름표, 그 아래 카드 칸은 박스 벽지 */
.sec-title { display: flex; align-items: baseline; gap: 10px; width: fit-content; margin: 18px 0 0 10px; padding: 6px 16px 4px; background: var(--ink); color: #fff; border-radius: 12px 12px 0 0; font-family: var(--pixel); font-size: var(--t1); font-weight: 700; }
.sec-title small { font-family: var(--font); font-size: 14px; font-weight: 700; color: #c9d6ea; }
.sec-title.lead { background: none; color: var(--ink); padding: 0; margin: 16px 4px 0; flex-wrap: wrap; }
.sec-title.lead small { color: var(--ink-soft); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 10px; padding: 12px; border: 4px solid var(--ink); border-radius: 16px;
  background: var(--paper-2) repeating-conic-gradient(rgba(255,255,255,.55) 0 25%, rgba(255,255,255,0) 0 50%) 0 0 / 28px 28px; }
.pcard { position: relative; min-height: 118px; border-radius: 12px; background: var(--paper); border: 3px solid #b9c7d8; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 4px; box-shadow: 0 3px 0 rgba(38,49,71,.22); }
.pcard:active { transform: translateY(2px); }
.pcard .pic { position: relative; width: 72px; height: 72px; }
.pcard .nm { font-size: 13px; font-weight: 800; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard.r-r { border-color: #7fb2ea; }
.pcard.r-u { border-color: #b393e8; }
.pcard.r-l { border-color: var(--gold); background: #fff8e3; }
.pcard .dots { position: absolute; left: 6px; top: 6px; display: flex; gap: 3px; }
.pcard .dots i { width: 7px; height: 7px; border-radius: 2px; background: #c3cfdd; }
.pcard .dots i.me { background: var(--gold); box-shadow: 0 0 0 1px var(--ink); }
.pcard.on { border: 4px solid var(--tc); box-shadow: 0 0 0 3px var(--ink), 0 3px 0 3px rgba(38,49,71,.3); }
.pcard.on::after { content: "✓"; position: absolute; top: 4px; right: 4px; width: 26%; aspect-ratio: 1; border-radius: 8px; background: var(--tc); border: 2px solid var(--ink); color: #fff; font-weight: 900; font-size: 15px; display: grid; place-items: center; }
.pcard.taken { opacity: .35; }
.pcard.fam { opacity: .5; }
.pcard .who { position: absolute; top: 4px; right: 4px; font-size: 16px; }
.notice { background: var(--paper); border: 4px solid var(--ink); border-radius: 16px; box-shadow: var(--win), var(--lift); padding: 16px; margin: 12px 0; font-size: 16px; font-weight: 700; line-height: 1.6; text-align: center; }
.notice .btn { margin-top: 10px; }
.grid.empty-grid { display: block; text-align: center; padding: 20px 16px; font-size: 16px; font-weight: 700; line-height: 1.6; }
.link-row { text-align: center; margin: 20px 0 6px; }

/* ===== 윷판 화면 ===== */
.game .bar { min-height: 66px; padding: 6px 12px; }
.turn-pill { flex: 1; display: flex; justify-content: center; min-width: 0; }
.turn-pill span { background: var(--tc, var(--ink)); color: #fff; font-family: var(--pixel); font-weight: 700; font-size: var(--t1); padding: 9px 20px 8px; border: 3px solid var(--ink); border-radius: 12px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.5), 0 4px 0 var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.game-main { flex: 1; min-height: 0; display: flex; gap: 16px; padding: 0 14px 14px; align-items: center; justify-content: center; }
.game.port .game-main { flex-direction: column; justify-content: flex-start; }
.board-wrap { flex: none; width: var(--bs); height: var(--bs); }
.panel { flex: 1 1 auto; min-width: 0; max-width: 400px; align-self: stretch; display: flex; flex-direction: column; justify-content: center; gap: 14px; min-height: 0; }
.game.port .panel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; width: 100%; max-width: 760px; flex: none; align-self: center; }
.game.port .mat { width: min(100%, 200px); }
/* 가로 화면이 낮으면(주소창 때문에 패드는 700px 안팎) 패널을 줄여서 위쪽 줄(가방·소리 버튼)을 덮지 않게 */
.game.land.tight .panel, .game.land.tight .teams { gap: 8px; }
.game.land.tight .tcard { padding: 6px 10px 8px; }
.game.land.tight .pchips { margin-top: 4px; }
.game.land.tight .pchip { width: 46px; height: 46px; }
.game.land.tight .throw-zone { padding: 10px 12px; gap: 6px; }
.game.land.tight .mat { width: min(100%, 170px); }
.game.land.tight .pending { height: 44px; }
.game.land.tight .btn.throw { min-height: 56px; }
.game.land.tight .hint { min-height: calc(var(--t1) * 1.45 * 2 + 20px); }
/* 더 낮으면(안드로이드 가로 — 주소창·아래 버튼줄 때문에 높이가 낮다) 멍석을 숨기지 않고 작게 줄여 던지기 버튼 옆에 나란히 (사용자 요청 2026-10-02: 가로에서 윷이 안 보임) */
.game.land.tighter .throw-zone { grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 10px; justify-items: stretch; }
.game.land.tighter .mat { width: clamp(96px, 11vw, 140px); grid-row: span 2; justify-self: center; }
.game.land.tighter .pending { height: 44px; }
.game.land.tighter .hint { grid-column: 1 / -1; }
/* 폰 가로(높이 400px 안팎): 그래도 넘치면 던지기 칸(멍석 · 버튼 · 안내)을 맨 위에 두고, 팀 카드는 그 아래에서 밀어 본다 — 위쪽 줄을 덮지 않게 */
.game.land.tightest .panel { justify-content: flex-start; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 4px; }
.game.land.tightest .throw-zone { order: -1; flex: none; padding: 8px 10px; }
.game.land.tightest .hint { min-height: 0; height: calc(var(--t1) * 1.45 * 2 + 16px); padding-top: 6px; padding-bottom: 6px; }
.game.land.tightest .teams { flex: none; }
/* 가로: 안내 칸은 3줄까지 — 판을 잴 때는 3줄로 재서, 긴 알림이 떠도 패널이 넘쳐 위쪽 줄(가방)을 덮지 않게 */
.game.land .hint { height: calc(var(--t1) * 1.45 * 3 + 20px); min-height: 0; overflow: hidden; } /* 높이 고정 — 글 길이가 바뀌어도 멍석·버튼이 안 움직이게 */
.game.land .hint.measure { height: calc(var(--t1) * 1.45 * 3 + 20px); }
/* 세로 화면: 안내 칸 높이를 고정 — 글이 길어져도 판 크기가 들썩이지 않게 (3줄, 폰은 4줄) */
.game.port .hint { height: calc(var(--t1) * 1.45 * 3 + 20px); min-height: 0; overflow: hidden; }
@media (max-width: 520px) {
  .game.port .hint { height: calc(var(--t1) * 1.45 * 4 + 20px); }
  .game.port .mat { width: min(100%, 150px); }
  .tcard .tn em { display: none; }
  .pchip { width: 46px; height: 46px; }
}

/* 윷판 — 먹선 틀 안에 도트 풀밭 */
.board {
  position: relative; width: 100%; height: 100%; border-radius: 18px; overflow: hidden;
  box-shadow: 0 0 0 3px #fff, 0 0 0 7px var(--ink), 0 11px 0 7px rgba(38,49,71,.25);
  background: #8fd16f repeating-conic-gradient(#8fd16f 0 25%, #86ca66 0 50%) 0 0 / 6.25% 6.25%;
}
.art-field .board { background: #8fd16f url(assets/board/field.png) center / 100% 100% no-repeat; image-rendering: pixelated; }
.board svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.road-edge { fill: none; stroke: #6d4c2c; stroke-opacity: .5; stroke-width: 5.8; stroke-linecap: round; stroke-linejoin: round; }
.road { fill: none; stroke: #ecd29c; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
.art-path .road { stroke: url(#dirt); }
.tile {
  position: absolute; width: 8.4%; aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; border-radius: 50%;
  background: radial-gradient(circle at 42% 38%, #fffaf0 0 28%, #e6ddcb 56%, #b6aa93 57% 65%, rgba(0,0,0,0) 66%);
}
.tile.corner { width: 11.2%; background: radial-gradient(circle at 42% 38%, #fffaf0 0 26%, #e6ddcb 50%, #b6aa93 51% 57%, #ff8fb3 58% 66%, rgba(0,0,0,0) 67%); }
.tile.center { width: 12.8%; background: radial-gradient(circle, #fff 0 9%, #2b3645 10% 15%, rgba(0,0,0,0) 16%), linear-gradient(#ef4b4b 0 46%, #2b3645 46% 54%, #fafafa 54%); border-radius: 50%; box-shadow: 0 0 0 4px #b6aa93; }
.tile.start { width: 12.8%; background: radial-gradient(circle at 42% 38%, #fff6cf 0 26%, #ffd45e 55%, #c99a1c 56% 64%, rgba(0,0,0,0) 65%); }
.art-tileNormal .tile.normal, .art-tileCorner .tile.corner, .art-tileCenter .tile.center, .art-tileStart .tile.start {
  background-position: center; background-size: contain; background-repeat: no-repeat; image-rendering: pixelated; border-radius: 0; box-shadow: none;
}
.art-tileNormal .tile.normal { background-image: url(assets/board/tile-normal.png); }
.art-tileCorner .tile.corner { background-image: url(assets/board/tile-corner.png); }
.art-tileCenter .tile.center { background-image: url(assets/board/tile-center.png); }
.art-tileStart .tile.start { background-image: url(assets/board/tile-start.png); }
.lbl { position: absolute; transform: translate(-50%, -50%); font-size: calc(var(--bs) * .03); font-weight: 900; color: #fff; white-space: nowrap; pointer-events: none;
  text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }
.lbl.arrow { font-size: calc(var(--bs) * .045); }

.unit {
  position: absolute; width: 12%; min-width: 44px; aspect-ratio: 1; transform: translate(-50%, -64%); z-index: 10; cursor: pointer;
  transition: left calc(.2s * var(--spd)) ease-out, top calc(.2s * var(--spd)) ease-out;
}
.unit .base { position: absolute; left: 16%; right: 16%; bottom: 2%; height: 24%; border-radius: 50%; background: var(--tc); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink), 0 4px 0 5px rgba(38,49,71,.3); }
.unit .front, .unit .behind { position: absolute; inset: 0; }
.unit .behind.b1 { transform: translate(-20%, -10%) scale(.84); filter: brightness(.9); }
.unit .behind.b2 { transform: translate(20%, -14%) scale(.78); filter: brightness(.82); }
.unit .badge-n { position: absolute; top: -4%; right: -10%; min-width: 36%; height: 34%; padding: 0 4px; border-radius: 8px; background: var(--gold); color: var(--ink); border: 2px solid var(--ink); font-weight: 900; font-size: max(12px, calc(var(--bs) * .028)); display: grid; place-items: center; z-index: 3; }
.unit .badge-t { position: absolute; bottom: -2%; left: -8%; width: 32%; height: 32%; border-radius: 50%; background: var(--tc); border: 2px solid var(--ink); font-size: max(10px, calc(var(--bs) * .02)); display: grid; place-items: center; z-index: 3; }
.unit.can .base { animation: glowBase 1s ease-in-out infinite; }
.unit.sel { z-index: 30; }
.unit.sel .base { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink), 0 0 0 9px var(--gold), 0 0 16px 9px rgba(245,184,46,.7); }
.unit.moving { z-index: 50; }
.unit.hop .front { animation: hop calc(.24s * var(--spd)) ease-out; }
.unit.enter .front { animation: popIn calc(.32s * var(--spd)) cubic-bezier(.2,1.6,.4,1) both; }
.unit.going-home { z-index: 45; transition: left calc(.75s * var(--spd)) cubic-bezier(.4,-.35,.6,1), top calc(.75s * var(--spd)) cubic-bezier(.4,-.35,.6,1); animation: homeFade calc(.8s * var(--spd)) ease-in forwards; }
.unit.going-home .front { animation: hop calc(.25s * var(--spd)) ease-out 3; }
.unit.evolving .front { animation: evoPulse calc(1s * var(--spd)) ease-in-out both; }
.unit.evolving .front img { filter: brightness(0) invert(1) drop-shadow(0 0 5px #fff); transition: filter calc(.4s * var(--spd)); }
.unit.evolved .front { animation: evoPop calc(.6s * var(--spd)) cubic-bezier(.2,1.6,.4,1); }
.unit.finishing { animation: finishOut calc(.9s * var(--spd)) ease-in forwards; z-index: 60; }
.unit.stacked .front { animation: popIn calc(.35s * var(--spd)) cubic-bezier(.2,1.6,.4,1); }

.spr { position: absolute; inset: 0; display: block; }
.spr img { position: absolute; image-rendering: pixelated; pointer-events: none; }

/* 도착할 칸: 가운데는 비운 점선 고리 + 오른쪽 위 말풍선 (그 칸의 말을 가리지 않게) */
.dest {
  position: absolute; width: 12.6%; min-width: 46px; aspect-ratio: 1; transform: translate(-50%, -50%); z-index: 40; border-radius: 50%;
  border: 4px dashed #fff; background: rgba(255,255,255,.2); box-shadow: 0 0 0 3px var(--gold), 0 0 18px 4px rgba(245,184,46,.8);
  animation: ring 1s ease-in-out infinite;
}
.dest b { position: absolute; top: -34%; left: 10%; background: var(--gold); color: var(--ink); border: 3px solid var(--ink); border-radius: 10px; padding: 1px 9px; font-weight: 900; font-size: max(15px, calc(var(--bs) * .034)); white-space: nowrap; box-shadow: 0 3px 0 var(--ink); line-height: 1.3; }
.dest b small { font-size: .7em; margin-left: 3px; }
.dest.flip b { left: auto; right: 10%; } /* 영어판: 말풍선 글이 길어서 판 가운데 쪽으로 늘어나게 — 왼쪽 반은 오른쪽으로, 오른쪽 반(flip)은 왼쪽으로 */
.dest.hit { box-shadow: 0 0 0 3px var(--red), 0 0 18px 4px rgba(229,72,77,.8); }
.dest.hit b { background: var(--red); color: #fff; }
.dest.back b { background: #9cc9f5; }
.dest.goal b { background: var(--green); color: #fff; }
.dest.cpu { pointer-events: none; }

.fx-burst { position: absolute; transform: translate(-50%, -50%); font-size: calc(var(--bs) * .13); z-index: 70; pointer-events: none; animation: burst calc(.85s * var(--spd)) ease-out forwards; }
.spark { position: absolute; font-size: calc(var(--bs) * .04); z-index: 70; pointer-events: none; animation: spark calc(.9s * var(--spd)) ease-out forwards; }

/* 오른쪽 패널 — 팀 카드는 포켓몬 파티 창처럼 */
.teams { display: grid; gap: 12px; }
.tcard { background: var(--paper); border: 4px solid var(--ink); border-radius: 16px; padding: 10px 12px 12px; box-shadow: var(--win), var(--lift); transition: transform .2s; }
.tcard.active { transform: scale(1.02); box-shadow: var(--win), 0 0 0 4px var(--tc), 0 9px 0 rgba(38,49,71,.3); }
.tcard .tn { font-family: var(--pixel); font-weight: 700; font-size: var(--t1); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tcard .tn i { flex: none; width: 16px; height: 16px; border-radius: 4px; background: var(--tc); border: 2px solid var(--ink); }
.tcard .tn em { margin-left: auto; font-family: var(--font); font-style: normal; font-size: 14px; font-weight: 800; color: var(--ink-soft); }
.pchips { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.pchip { position: relative; width: 52px; height: 52px; border-radius: 10px; background: var(--paper-2); }
.pchip.board { opacity: .45; }
.pchip.done { background: #fff1c9; box-shadow: inset 0 0 0 3px var(--gold); }
.pchip.done::after { content: "🏁"; position: absolute; top: -6px; right: -6px; font-size: 16px; }
.pchip .ball { position: absolute; right: -5px; bottom: -5px; width: 42%; image-rendering: pixelated; pointer-events: none; }
.pchip.can { box-shadow: 0 0 0 3px var(--tc); animation: glowChip 1s ease-in-out infinite; }
.pchip.selected { box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--gold); }

.throw-zone { background: var(--paper); border: 4px solid var(--ink); border-radius: 16px; box-shadow: var(--win), var(--lift); padding: 14px; display: grid; gap: 10px; justify-items: center; }
.mat {
  position: relative; width: min(100%, 240px); aspect-ratio: 1.5;
  background: radial-gradient(ellipse at center, #efd38e 0 58%, #cfa85c 59% 68%, #a47c3c 69% 71%, rgba(0,0,0,0) 72%);
}
.art-mat .mat { background: url(assets/ui/mat.png) center / 100% 100% no-repeat; image-rendering: pixelated; }
.sticks { position: absolute; inset: 16% 20%; display: flex; justify-content: space-around; align-items: center; }
.stick {
  position: relative; width: 14%; height: 92%; border-radius: 40% / 12%; transform: rotate(var(--r, 0deg));
  background: linear-gradient(90deg, #7f5025, #b77b3e 50%, #7f5025); border: 2px solid #5a3818;
}
.stick.flat { background: linear-gradient(90deg, #edcf95, #fbe9c3 50%, #edcf95); }
.stick.flat.mark::after { content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; color: #e0263b; font-weight: 900; font-size: 20px; }
.art-sticks .stick { border: 0; border-radius: 0; background: url(assets/ui/stick-round.png) center / contain no-repeat; image-rendering: pixelated; }
.art-sticks .stick.flat { background-image: url(assets/ui/stick-flat.png); }
.art-sticks .stick.flat.mark { background-image: url(assets/ui/stick-back.png); }
.art-sticks .stick.flat.mark::after { display: none; }
.stick.toss { animation: toss calc(.72s * var(--spd)) cubic-bezier(.3,.6,.4,1) both; animation-delay: calc(var(--d, 0s) * var(--spd)); }
/* 남은 결과 줄은 높이를 고정 — 결과가 늘어도 줄이 커지지 않아 멍석·버튼이 위아래로 움직이지 않게 (사용자 제보 2026-10-03). 많으면 작게(.compact → .tiny) */
.pending { display: flex; gap: 6px; height: 48px; flex-wrap: nowrap; justify-content: center; align-items: center; overflow: hidden; width: 100%; }
.pending.compact { gap: 4px; } .pending.compact .lab { display: none; }
.pending.compact .rchip { padding-right: 6px; font-size: calc(var(--t1) * .85); } .pending.compact .rchip img { width: 28px; height: 28px; }
.pending.tiny .rchip img { display: none; } .pending.tiny .rchip { padding: 0 6px; }
.pending .lab { font-size: 14px; font-weight: 800; color: var(--ink-soft); }
.pending .lab, .pending .rchip { flex: none; white-space: nowrap; } /* 영어판: 글이 길어 칩이 줄어들며 글자가 세로로 꺾이지 않게 — 넘치면 위 .compact → .tiny → .mini 로 작게 */
.pending.mini { gap: 2px 3px; flex-wrap: wrap; align-content: center; } .pending.mini .rchip { padding: 0 4px; font-size: calc(var(--t1) * .68); line-height: 1.15; border-width: 2px; box-shadow: none; } /* 그래도 넘치면 두 줄로 */
.rchip { display: inline-flex; align-items: center; gap: 2px; background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; padding: 0 10px 0 0; font-family: var(--pixel); font-weight: 700; font-size: var(--t1); box-shadow: 0 3px 0 var(--ink); }
.rchip img { width: 36px; height: 36px; object-fit: contain; }
.btn.throw { width: 100%; white-space: nowrap; overflow: hidden; padding-left: 12px; padding-right: 12px; }
/* 안내 칸 = 윷판 화면의 DS 대화창. 알림(진화·업기·골인…)도 여기에 떠서 판을 가리지 않는다 */
.hint { position: relative; width: 100%; min-height: calc(var(--t1) * 2.9 + 20px); padding: 10px 34px 10px 14px; background: var(--paper-2); border: 3px solid var(--ink); border-radius: 12px;
  font-family: var(--pixel); font-weight: 700; font-size: var(--t1); line-height: 1.45; color: var(--ink); text-align: left; }
.hint.say { background: #fff6d9; }
.hint.say::after { content: "▼"; position: absolute; right: 10px; bottom: 6px; font-size: 14px; color: var(--red); animation: blink 1s steps(1) infinite; }
@media (max-width: 520px) { .btn.throw { padding-left: 6px; padding-right: 6px; } }

/* ===== 겹쳐 뜨는 것들 — 전부 DS 대화창 ===== */
#overlay { position: fixed; inset: 0; z-index: 400; display: none; place-items: center; background: rgba(20,28,44,.55); padding: 16px; }
#overlay.show { display: grid; }
.modal { background: var(--paper); border: 4px solid var(--ink); border-radius: 18px; box-shadow: var(--win), 0 8px 0 rgba(38,49,71,.35); padding: 24px; width: min(540px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; text-align: center; animation: popIn .25s cubic-bezier(.2,1.4,.4,1) both; }
.modal h2 { font-family: var(--pixel); font-size: var(--t2); font-weight: 700; line-height: 1.2; margin-bottom: 12px; }
.modal p { font-size: 17px; font-weight: 600; line-height: 1.6; color: var(--ink-soft); }
.modal p b { color: var(--ink); }
.modal .btns { display: grid; gap: 12px; margin-top: 18px; }
.modal input { font-family: var(--pixel); font-size: var(--t2); font-weight: 700; text-align: center; letter-spacing: 4px; width: 100%; min-height: 60px; border-radius: 12px; border: 3px solid var(--ink); box-shadow: inset 0 3px 0 var(--paper-2); padding: 8px; margin-top: 14px; color: var(--ink); background: #fff; }
.modal input:focus { outline: 4px solid var(--gold); outline-offset: 2px; }
.modal .small { font-size: 14px; margin-top: 10px; min-height: 20px; }
.rules-res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0 16px; }
.rules-res div { background: var(--paper-2); border-radius: 12px; padding: 8px 6px; font-size: 14px; color: var(--ink-soft); font-weight: 700; }
.rules-res img { width: 70%; aspect-ratio: 1; object-fit: contain; display: block; margin: 0 auto; }
.rules-res b { display: block; font-family: var(--pixel); font-size: var(--t2); color: var(--ink); line-height: 1.1; margin: 2px 0; }
.rules-list { text-align: left; list-style: none; display: grid; gap: 8px; font-size: 16px; font-weight: 600; line-height: 1.55; }
.rules-list li { background: var(--paper-2); border-radius: 12px; padding: 9px 14px; }
.stats-list { display: grid; gap: 8px; margin: 10px 0 14px; }
.stats-list div { display: flex; justify-content: space-between; align-items: center; background: var(--paper-2); border-radius: 12px; padding: 10px 16px; font-size: 18px; font-weight: 800; }
.stats-list div span:last-child { font-family: var(--pixel); font-size: var(--t1); }

/* 알림 = DS 대화창 (깜빡이는 ▼) */
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translate(-50%, calc(100% + 60px)); opacity: 0; z-index: 350;
  background: var(--paper); color: var(--ink); border: 4px solid var(--ink); border-radius: 14px; box-shadow: var(--win), var(--lift);
  font-family: var(--pixel); font-weight: 700; font-size: var(--t1); line-height: 1.45; padding: 14px 42px 14px 20px;
  width: max-content; max-width: calc(100% - 32px); text-align: left; transition: transform .25s, opacity .25s; pointer-events: none; }
#toast::after { content: "▼"; position: absolute; right: 14px; bottom: 8px; font-size: 16px; color: var(--red); animation: blink 1s steps(1) infinite; }
#toast.show { transform: translate(-50%, 0); opacity: 1; }
body.game-land #toast { left: auto; right: 14px; max-width: min(400px, 34vw); transform: translateY(calc(100% + 60px)); }
body.game-land #toast.show { transform: none; }
.banner { position: fixed; left: 50%; top: 24%; z-index: 330; font-family: var(--pixel); font-weight: 700; font-size: var(--t3); line-height: 1.1; color: #fff; padding: 16px 34px 14px; border: 4px solid var(--ink); border-radius: 16px; background: var(--bg, var(--ink)); box-shadow: inset 0 0 0 3px rgba(255,255,255,.55), 0 7px 0 rgba(38,49,71,.4); white-space: nowrap; pointer-events: none; animation: bannerIn var(--dur, 1.1s) ease both; }
.banner.gold { background: var(--gold); color: var(--ink); }

.result-pop { position: fixed; inset: 0; z-index: 320; display: grid; place-items: center; background: rgba(20,28,44,.3); }
.result-pop.out { opacity: 0; transition: opacity calc(.2s * var(--spd)); }
.result-card { position: relative; width: min(66vmin, 440px); aspect-ratio: 1; display: grid; place-items: center; animation: popIn calc(.35s * var(--spd)) cubic-bezier(.2,1.4,.4,1) both; }
.result-card .rays { position: absolute; inset: -12%; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255,226,120,.95) 0 9deg, rgba(255,255,255,0) 9deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 25%, rgba(0,0,0,0) 70%); mask: radial-gradient(circle, #000 25%, rgba(0,0,0,0) 70%);
  animation: spin 7s linear infinite; }
.result-card img { position: relative; width: 60%; filter: drop-shadow(0 10px 0 rgba(38,49,71,.25)); animation: bob 1.2s ease-in-out infinite; }
.result-name { position: absolute; bottom: 8%; font-family: var(--pixel); font-weight: 700; font-size: var(--t5); color: #fff; line-height: 1;
  text-shadow: 5px 0 0 var(--ink), -5px 0 0 var(--ink), 0 5px 0 var(--ink), 0 -5px 0 var(--ink), 5px 5px 0 var(--ink), -5px 5px 0 var(--ink), 5px -5px 0 var(--ink), -5px -5px 0 var(--ink), 0 11px 0 rgba(38,49,71,.35); }
.result-sub { position: absolute; bottom: -5%; background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; padding: 6px 16px 5px; font-family: var(--pixel); font-weight: 700; font-size: var(--t1); box-shadow: 0 4px 0 var(--ink); white-space: nowrap; }
.result-pop.r4 .result-name, .result-pop.r5 .result-name { color: #ffd23f; }
/* 🔤 단어 세트 */
.wpic { display: inline-block; line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.wpic[style*="--k"] { transform: scale(var(--k)); }
.wpic.sw { width: .9em; height: .9em; background: var(--c); border: 3px solid var(--ink); border-radius: .18em; box-sizing: border-box; vertical-align: middle; }
.wpic.tag { font-family: var(--pixel); font-size: .55em; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 6px; padding: 2px 4px; vertical-align: middle; }
.result-word { bottom: 13%; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 0 4%; box-sizing: border-box; font-size: var(--t4); }
.result-word .rw { flex: 0 1 auto; min-width: 0; white-space: nowrap; line-height: 1.25; } /* g·p·y 아래가 잘리지 않게 */
.result-word .wpic { flex: none; font-size: .9em; } /* 그림은 그대로, 글자만 줄인다 (fitText) */
.result-word .wpic.tag { font-size: .45em; text-shadow: none; }
.result-word .wpic.sw { font-size: .7em; }
@media (max-width: 520px) { .cast b { padding: 2px 4px; min-width: 0; } }
.rchip.word { padding: 2px 8px; gap: 4px; }
.dest b .wpic { margin-right: 3px; }
.words-ov { position: fixed; inset: 0; z-index: 330; display: grid; place-items: center; padding: 16px; background: rgba(12,18,30,.7); animation: fadeIn .2s ease both; }
.words-ov.out { opacity: 0; transition: opacity calc(.25s * var(--spd)); }
.words-card { width: min(860px, 100%); background: var(--paper); border: 4px solid var(--ink); border-radius: 18px; box-shadow: var(--win), var(--lift); padding: 18px 16px 14px; text-align: center; }
.words-card h2 { font-family: var(--pixel); font-size: var(--t2); margin-bottom: 14px; }
.words-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.wtile { display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--paper-2); border: 3px solid var(--ink); border-radius: 14px; padding: 12px 4px 10px; min-width: 0;
  animation: popIn calc(.35s * var(--spd)) cubic-bezier(.2,1.4,.4,1) both; animation-delay: calc(var(--i) * .5s * var(--spd)); }
.wtile .wpic { font-size: 54px; height: 60px; display: grid; place-items: center; }
.wtile .wpic.tag { font-size: 22px; height: auto; padding: 8px 6px; margin: 10px 0; }
.wtile b { font-family: var(--pixel); font-size: var(--t1); max-width: 100%; overflow-wrap: anywhere; }
.wtile small { font-size: 13px; font-weight: 800; color: var(--ink-soft); }
.words-tap { margin-top: 12px; font-weight: 800; color: var(--ink-soft); }
@media (max-width: 640px) { .words-row { grid-template-columns: repeat(3, minmax(0, 1fr)); } .wtile .wpic { font-size: 40px; height: 46px; } }
.result-pop.r-1 .result-name { color: #9fd3ff; }

.win-screen, .rocket-intro { position: fixed; inset: 0; z-index: 380; display: grid; place-items: center; padding: 16px; animation: fadeIn .4s ease both; }
/* 우승 화면은 상자·볼·돈 문제까지 붙어서 길다 — 화면보다 길면 스크롤 (가운데 맞춤이면 위아래가 잘려서 flex + margin auto) */
.win-screen { display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); }
.win-screen .win-inner { margin: auto; flex: none; }
.win-screen { background: linear-gradient(#7cc8ff, #d9f1ff 70%, #a6e08a); }
.art-win .win-screen { background: #7cc8ff url(assets/ui/win-bg.webp) center / cover no-repeat; }
.win-inner { width: min(760px, 100%); text-align: center; background: var(--paper); border: 4px solid var(--ink); border-radius: 20px; padding: 22px; box-shadow: var(--win), 0 8px 0 rgba(38,49,71,.35); }
.win-inner h1 { font-family: var(--pixel); font-weight: 700; font-size: var(--t3); line-height: 1.15; }
.win-inner p { font-size: 18px; font-weight: 700; color: var(--ink-soft); margin: 8px 0 12px; }

  text-shadow: 4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 4px 0 var(--ink), 0 -4px 0 var(--ink), 4px 4px 0 var(--ink), -4px 4px 0 var(--ink), 4px -4px 0 var(--ink), -4px -4px 0 var(--ink), 0 9px 0 rgba(0,0,0,.3);

.bt-dialog { position: relative; width: min(100%, 1000px, calc((100vh - 200px) * 16 / 9)); min-height: 90px; background: var(--paper); border: 5px solid var(--ink); border-radius: 16px; box-shadow: var(--win), 0 6px 0 rgba(0,0,0,.3); padding: 16px 44px 16px 24px; font-family: var(--pixel); font-size: var(--t2); font-weight: 700; line-height: 1.4; color: var(--ink); }

/* 야생 포켓몬 바로 옆의 희귀도 표시 (이름판과 별개로 크게) */
.bt-rar { position: absolute; transform: translate(-50%, -50%); z-index: 3; pointer-events: none; white-space: nowrap; font-family: var(--pixel); font-weight: 700; font-size: var(--t1); line-height: 1;
  padding: 6px 12px 5px; border: 3px solid var(--ink); border-radius: 12px; color: #fff; background: #7d8a9c; box-shadow: 0 4px 0 rgba(38,49,71,.35); animation: rarIn calc(.4s * var(--spd)) cubic-bezier(.2,1.6,.4,1) both; }
@keyframes rarIn { from { transform: translate(-50%, -50%) scale(.3); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } } /* popIn 은 가운데 맞춤(translate)을 지워 버려서 따로 */

/* ===== v3: ✨ 기술 · 🔄 말 바꾸기 ===== */
.btn[hidden] { display: none !important; }

/* 던지기 + ✨ 기술 한 줄 — 칸이 좁으면(폰) 기술 버튼이 아래 줄로 내려간다. ▶ 커서와 글자는 한 줄로 */

.pchip .sk { position: absolute; top: -7px; left: -7px; width: 42%; aspect-ratio: 1; border-radius: 50%; background: var(--gold); border: 2px solid var(--ink); display: grid; place-items: center; font-size: 11px; line-height: 1; z-index: 2; }

  /* 폰: 안내 칸이 좁아서 도트 글꼴(22px)은 한 줄에 서너 글자뿐 — 낱말이 쪼개지지 않게 보통 글꼴로 */

}
/* 윷판: 말의 효과 표시(왼쪽 위) · 함정 칸 */

/* 기술 고르기 창 */
.skill-list { display: grid; gap: 10px; margin: 6px 0 10px; text-align: left; }
.skill-item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 76px; padding: 8px 14px 8px 12px; border: 3px solid var(--ink); border-radius: 14px; background: var(--paper);
  box-shadow: inset 7px 0 0 var(--tc), 0 4px 0 var(--ink); text-align: left; }
.skill-item:active { transform: translateY(3px); box-shadow: inset 7px 0 0 var(--tc), 0 1px 0 var(--ink); }
.skill-item.info { box-shadow: inset 7px 0 0 var(--tc); border-style: dashed; cursor: default; }
.si-pic { position: relative; width: 56px; height: 56px; flex: none; }
.si-body { display: grid; gap: 2px; min-width: 0; }
.si-body b { font-family: var(--pixel); font-weight: 700; font-size: var(--t1); }
.si-body b i { font-style: normal; font-family: var(--font); font-size: 12px; font-weight: 900; color: #fff; background: var(--tc); border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; margin-left: 6px; vertical-align: middle; }
.si-body small { font-size: 14px; font-weight: 700; color: var(--ink-soft); line-height: 1.45; }
.emote-btn:disabled { opacity: .45; }
.emote-pick { position: fixed; z-index: 380; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: calc(100vw - 16px); padding: 8px; background: var(--paper); border: 4px solid var(--ink); border-radius: 18px; box-shadow: var(--win), var(--lift); animation: popIn .18s ease-out; }
.emote-pick .emo { display: grid; justify-items: center; gap: 2px; width: 76px; min-height: 92px; padding: 4px 2px; background: var(--paper-2); border: 3px solid var(--ink); border-radius: 14px; font: inherit; cursor: pointer; }
.emote-pick .emo:active { transform: scale(.94); }
.emo-pic { position: relative; display: block; width: 56px; height: 56px; }
.emo-pic img { width: 100%; height: 100%; object-fit: contain; }
.emo-mark { position: absolute; right: -8%; bottom: -6%; width: 50%; height: 50%; display: grid; place-items: center; font-style: normal; font-size: 22px; background: #fff; border: 2px solid var(--ink); border-radius: 50%; line-height: 1; }
.emote-pop .emo-mark { font-size: 26px; }
.emote-pop[data-k="joy"] .emo-pic img { animation: emoJoy .5s ease-in-out 3; }
.emote-pop[data-k="wow"] .emo-pic img { animation: emoWow .4s ease-out 2; }
.emote-pop[data-k="sad"] .emo-pic img { filter: saturate(.55) brightness(.95); transform: rotate(-8deg) translateY(4%); }
.emote-pop[data-k="huff"] .emo-pic img { animation: emoHuff .12s linear 8; }
.emote-pop[data-k="good"] .emo-pic img { animation: emoGood .6s ease-in-out 2; }
@keyframes emoJoy { 50% { transform: translateY(-14%); } }
@keyframes emoWow { 40% { transform: scale(1.18); } }
@keyframes emoHuff { 25% { transform: translateX(-4%); } 75% { transform: translateX(4%); } }
@keyframes emoGood { 50% { transform: rotate(10deg) scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .emote-pop .emo-pic img { animation: none !important; } }
.emote-pick .emo b { font-size: 12px; font-weight: 900; white-space: nowrap; }
.emote-pop { position: fixed; z-index: 370; pointer-events: none; display: flex; align-items: center; gap: 4px; padding: 4px 10px 4px 4px; background: #fff; border: 4px solid var(--tc); border-radius: 18px; box-shadow: var(--lift); animation: popIn .25s ease-out; transition: opacity .3s, transform .3s; }
.emote-pop .emo-pic { width: 64px; height: 64px; }
.emote-pop b { font-family: var(--font); font-size: 18px; font-weight: 900; white-space: nowrap; }
.emote-pop.out { opacity: 0; transform: translateY(-8px); }
.roll { position: fixed; inset: 0; z-index: 360; display: grid; place-items: center; background: rgba(20,28,45,.35); animation: fadeIn .15s; }
.roll.out { opacity: 0; transition: opacity .2s; }
.roll-card { width: min(420px, calc(100vw - 32px)); padding: 16px 18px 14px; background: var(--paper); border: 4px solid var(--ink); border-radius: 20px; box-shadow: var(--win), var(--lift); text-align: center; }
.roll-title { display: block; font-family: var(--font); font-size: 20px; font-weight: 900; margin-bottom: 10px; }
.roll-bar { position: relative; height: 40px; background: #c9ced8; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; }
.roll-win { position: absolute; left: 0; top: 0; bottom: 0; background: #2fa35a; }
.roll-lab { display: flex; margin-top: 4px; font-family: var(--font); font-size: 14px; font-weight: 900; }
.roll-lab em { font-style: normal; text-align: center; white-space: nowrap; }
.roll-lab .g { color: #2fa35a; flex: 0 0 auto; } .roll-lab .x { color: #6b7488; flex: 1 1 0; }
.roll-needle { position: absolute; top: -4px; bottom: -4px; width: 6px; margin-left: -3px; left: 2%; background: var(--ink); border-radius: 3px; box-shadow: 0 0 0 2px #fff; }
.roll-res { display: block; min-height: 44px; margin-top: 10px; font-family: var(--pixel); font-size: 34px; font-weight: 700; line-height: 1.3; }
.roll.ok .roll-res { color: #2fa35a; animation: popIn .3s ease-out; }
.roll.no .roll-res { color: #6b7488; animation: rollShake .35s linear; }
.roll.ok .roll-card { border-color: #2fa35a; box-shadow: 0 0 0 4px #fff, 0 0 26px 8px rgba(47,163,90,.7); }
.roll.no .roll-card { filter: saturate(.6); }
@keyframes rollShake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@media (prefers-reduced-motion: reduce) { .roll-res { animation: none !important; } }
.coin-ov { position: fixed; inset: 0; z-index: 390; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 12px; padding: 12px; overflow-y: auto; background: rgba(12,18,30,.86); animation: fadeIn .2s ease both; }
.coin-ov.out { opacity: 0; transition: opacity .25s; }
.coin-stage { position: relative; flex: 0 0 auto; width: min(100%, 860px, calc((100vh - 190px) * 16 / 10)); aspect-ratio: 16 / 10; border-radius: 16px; overflow: hidden;
  box-shadow: 0 0 0 3px #fff, 0 0 0 7px var(--ink), 0 14px 30px rgba(0,0,0,.4); background: #8fd3ff url(assets/ui/battle-bg.png) center / cover no-repeat; image-rendering: pixelated; }
.ct-title { position: absolute; left: 50%; top: 5%; transform: translateX(-50%); margin: 0; white-space: nowrap; font-family: var(--pixel); font-weight: 700; font-size: var(--t3); color: #ffd23f;
  text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 3px 3px 0 var(--ink), -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink), 0 7px 0 rgba(38,49,71,.45); }
.ct-plate { position: absolute; bottom: 5%; width: 42%; display: flex; align-items: center; gap: 8px; background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; padding: 6px 10px 6px 12px; box-shadow: inset 5px 0 0 var(--tc), 0 4px 0 var(--ink); transition: transform .3s, box-shadow .3s, filter .3s; }
.ct-plate.p0 { left: 4%; } .ct-plate.p1 { right: 4%; }
.ct-mon { position: relative; flex: 0 0 auto; width: 22%; aspect-ratio: 1; }
.ct-pt { min-width: 0; flex: 1 1 auto; }
.ct-pt em { display: flex; align-items: center; gap: 4px; font-style: normal; font-family: var(--pixel); font-size: 13px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
.ct-mini { display: inline-block; flex: 0 0 auto; width: 20px; height: 20px; }
.ct-mini img { width: 100%; height: 100%; image-rendering: pixelated; }
.ct-pt b { display: block; font-family: var(--pixel); font-size: var(--t2); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ct-first { position: absolute; z-index: 2; right: -6px; top: -14px; font-family: var(--pixel); font-size: 15px; font-weight: 700; color: var(--ink); background: #ffd23f; border: 3px solid var(--ink); border-radius: 10px; padding: 2px 8px; transform: scale(0); transition: transform .25s cubic-bezier(.2,1.6,.4,1); }
.coin-ov.w0 .ct-plate.p0, .coin-ov.w1 .ct-plate.p1 { transform: translateY(-6px); box-shadow: inset 5px 0 0 var(--tc), 0 4px 0 var(--ink), 0 0 0 4px #ffd23f, 0 0 22px 6px rgba(255,210,63,.8); }
.coin-ov.w0 .ct-plate.p0 .ct-first, .coin-ov.w1 .ct-plate.p1 .ct-first { transform: scale(1); }
.coin-ov.w0 .ct-plate.p1, .coin-ov.w1 .ct-plate.p0 { filter: saturate(.5) brightness(.92); }
.ct-pad { position: absolute; left: 50%; top: 66%; width: 40%; aspect-ratio: 3 / 1; transform: translate(-50%, -50%); background: url(assets/ui/battle-pad.png) center / 100% 100% no-repeat; image-rendering: pixelated; }
.ct-shadow { position: absolute; left: 50%; top: 63%; width: 17%; aspect-ratio: 3 / 1; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(20,40,20,.35); }
.ct-coin { position: absolute; left: 50%; top: 42%; width: 26%; aspect-ratio: 1; transform: translate(-50%, -50%); padding: 0; border: 0; background: none; perspective: 700px; cursor: pointer; }
.ct-spin { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; }
.coin-ov:not(.tossing) .ct-spin { animation: ctBob 1.1s steps(4) infinite; }
@keyframes ctBob { 50% { transform: translateY(-6%); } }
.ct-face { position: absolute; inset: 0; backface-visibility: hidden; }
.ct-face img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 4px 0 rgba(38,49,71,.35)); }
.ct-face.back { transform: rotateY(180deg); }
.ct-dialog { width: min(100%, 860px, calc((100vh - 190px) * 16 / 10)); min-height: 70px; }
.ct-dialog .ct-say { margin: 0; }
.coin-ov.landed .ct-say { animation: popIn .3s ease-out; }
@media (max-width: 600px) {
  .coin-stage { aspect-ratio: 4 / 5; }
  .ct-plate { width: 88%; left: 6% !important; right: auto !important; }
  .ct-plate.p0 { bottom: 24%; } .ct-plate.p1 { bottom: 5%; }
  .ct-mon { width: 15%; }
  .ct-coin { top: 33%; width: 40%; } .ct-pad { top: 52%; width: 58%; } .ct-shadow { top: 50%; width: 24%; }
  .ct-title { font-size: var(--t2); }
}
@media (prefers-reduced-motion: reduce) { .coin-ov .ct-spin { animation: none !important; } }
body.coining #turn-pill { visibility: hidden; }
body.coining .tcard.active { border-color: var(--ink) !important; box-shadow: var(--win), var(--lift) !important; transform: none !important; }
.coin-ov.landed .ct-say { animation: popIn .3s ease-out; }
@media (prefers-reduced-motion: reduce) { .coin-ov .ct-spin { animation: none !important; } }

/* ===== 👑 전설 연출 ===== */
.unit.legend .base { background: linear-gradient(90deg, #ffd23f, #fff6c2, #ffd23f); animation: legendGlow 1.6s ease-in-out infinite; }
.unit.legend::after { content: "👑"; position: absolute; top: -18%; left: 50%; transform: translateX(-50%); font-size: max(12px, calc(var(--bs) * .026)); z-index: 4; filter: drop-shadow(0 1px 0 #fff); pointer-events: none; }
@keyframes legendGlow { 0%, 100% { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink), 0 0 8px 4px rgba(245,184,46,.5); } 50% { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink), 0 0 20px 10px rgba(245,184,46,.95); } }
.cutin.legend .ci-band { background: linear-gradient(90deg, #ff7a7a, #ffd23f, #7ee081, #6cc3ff, #b98cff, #ff7a7a); background-size: 300% 100%; animation: ciIn calc(.35s * var(--spd)) cubic-bezier(.2,1.2,.4,1) both, rainbow 2.4s linear infinite; border-color: #8a5a00; box-shadow: 0 0 0 4px #fff inset, 0 0 40px 12px rgba(255,210,63,.9); }

.ci-flash { position: absolute; inset: 0; background: radial-gradient(circle, #fff, rgba(255,246,194,.6) 40%, rgba(255,210,63,0) 70%); animation: flash calc(.9s * var(--spd)) ease-out both; pointer-events: none; }
.ci-rays { position: absolute; inset: -30%; background: repeating-conic-gradient(rgba(255,226,120,.5) 0 8deg, rgba(255,255,255,0) 8deg 20deg); animation: spin 6s linear infinite; pointer-events: none; -webkit-mask: radial-gradient(circle, #000 20%, rgba(0,0,0,0) 65%); mask: radial-gradient(circle, #000 20%, rgba(0,0,0,0) 65%); }

.bt-stage.legend { box-shadow: 0 0 0 3px #fff, 0 0 0 7px var(--gold), 0 0 40px 10px rgba(245,184,46,.7); }

.pchip .sk.left { background: var(--paper); color: var(--ink-soft); font-family: var(--font); font-size: 11px; font-weight: 900; }
@keyframes rainbow { to { background-position: 300% 0; } }

/* ===== v6: 😼 로켓단 캡슐 뽑기 · 🎲 확률 막대 · 효과 굉장 · 영어 ===== */
.gacha-ov { position: fixed; inset: 0; z-index: 385; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 50% 40%, #6b2a8f, #1d0b2e 75%); animation: fadeIn .2s ease both; overflow-y: auto; }

.gacha { width: min(560px, 100%); display: grid; gap: 12px; justify-items: center; text-align: center; color: #fff; }

.gacha p { font-family: var(--pixel); font-weight: 700; font-size: var(--t1); min-height: 1.4em; }
/* 캡슐 뽑기 기계 — 둥근 유리통 + 빨간 몸통 + 손잡이 + 나오는 구멍 */
.gacha-scene { position: relative; width: clamp(300px, 84vmin, 560px); aspect-ratio: 16 / 10; }
.g-machine { position: absolute; left: 50%; bottom: 6%; height: 94%; transform-origin: 50% 100%; translate: -50% 0; image-rendering: pixelated; filter: drop-shadow(0 6px 0 rgba(0,0,0,.35)); }
.g-meowth { position: absolute; left: 6%; bottom: 5%; height: 44%; image-rendering: pixelated; transform-origin: 50% 100%; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
.g-floor { position: absolute; left: 2%; right: 2%; bottom: 2%; height: 9%; border-radius: 50%; background: rgba(0,0,0,.28); }
.g-cap { position: absolute; left: 85%; top: 90%; width: 11%; aspect-ratio: 1; z-index: 2; transform: translate(-50%, -50%); }
.g-cap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; filter: hue-rotate(var(--hue, 0deg)) drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
.g-cap .c-open, .g-cap.open .c-closed { display: none; }
.g-cap.open .c-open { display: block; transform: scale(1.35); }
.g-mon { position: absolute; left: 85%; top: 60%; width: 22%; aspect-ratio: 1; z-index: 3; filter: drop-shadow(0 0 10px rgba(255,230,120,.9)); }
.g-mon img { image-rendering: pixelated; }
.gacha-out { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; min-height: 104px; }

.gacha-mon .pic { position: relative; width: 64px; height: 64px; }
.gacha-mon b { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.gacha-skip { font-size: 13px; opacity: .75; font-family: var(--font); }

const NUM_WORD = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve"];
const numWord = n => NUM_WORD[n] || String(n); // 칸 세기에 보이는 영어 낱말
const nameOf = id => D.names[id - 1] || "???";
const collectionIds = pid => ((Store.prof(pid) || {}).collection || []).map(x => x.id); // 👤 프로필의 보관함 (없으면 지금 프로필)
// 스타팅 포켓몬 — 1~9세대 첫 파트너 27마리. 처음에는 이것만 고를 수 있고, ❓ 풀숲에서 잡을 때마다 명단이 늘어난다
const STARTERS = [1, 4, 7, 152, 155, 158, 252, 255, 258, 387, 390, 393, 495, 498, 501, 650, 653, 656, 722, 725, 728, 810, 813, 816, 906, 909, 912];
const caughtOnly = pid => collectionIds(pid).filter(id => STARTERS.indexOf(id) < 0); // 잡은 순서대로
const rosterIds = pid => STARTERS.concat(caughtOnly(pid));                            // 고를 수 있는 포켓몬
const ownedSet = pid => new Set(rosterIds(pid));
const bagTotal = pid => Yut.Rewards.BALLS.reduce((t, b) => t + (((Store.prof(pid) || {}).bag || {})[b] || 0), 0);
const typesOf = id => String(D.types[id - 1] || "노말").split("·");
const moveOf = id => D.moves[id] || D.typeMove[typesOf(id)[0]] || "Tackle";
const fxOf = id => D.typeFx[typesOf(id)[0]] || "💥";
const rarityOf = id => D.rarity[id] || "c";
const frontUrl = id => "assets/sprites/front/" + id + ".png";
const artUrl = id => LOCAL_ART.has(Number(id)) ? "assets/sprites/art/" + id + ".webp" : OFFICIAL + id + ".png";
const evoPath = id => Yut.evoPath(id, D.evoFrom);
const skillName = k => (Yut.SKILLS[k] || {}).name || "";
const skillColor = k => D.typeColors[(Yut.SKILLS[k] || {}).type] || "#a8a878";
// 배울 수 있는 기술 = 그 모습의 타입 기술 (두 타입이면 둘 다)
const poolFor = id => Array.from(new Set([].concat(...typesOf(id).map(t => Yut.TYPE_SKILLS[t] || []))));
const rootOf = id => evoPath(id)[0]; // 진화 가족의 1단계 — 판 위에서는 이 모습으로 출발한다
const sameFamily = (list, id) => list.some(x => x !== id && rootOf(x) === rootOf(id));

// 도트 그림: 96px 칸 안의 실제 그림 영역(D.box)을 기준으로 상자에 꽉 차게 (bottom=발을 아래에 맞춤)
function spr(id, bottom, lazy) {
  const b = (D.box && D.box[id - 1]) || [16, 16, 64, 64];
  const m = Math.max(b[2], b[3]) / 0.9;
  const W = 96 / m * 100;
  const L = (0.5 - (b[0] + b[2] / 2) / m) * 100;
  const T = bottom ? (0.97 - (b[1] + b[3]) / m) * 100 : (0.5 - (b[1] + b[3] / 2) / m) * 100;
  return '<span class="spr"><img src="' + frontUrl(id) + '" alt="' + esc(nameOf(id)) + '" draggable="false"' + (lazy ? ' loading="lazy"' : "") +
    ' style="width:' + W.toFixed(1) + "%;left:" + L.toFixed(1) + "%;top:" + T.toFixed(1) + '%" onerror="sprFail(this)"></span>';
}
function sprFail(img) { img.onerror = null; img.src = "assets/items/poke-ball.png"; img.style.cssText = "width:70%;left:15%;top:15%"; }
function artFail(img, id) { img.onerror = null; img.src = frontUrl(id); img.classList.add("pix"); }

/* ================================================================
   저장 (윷놀이 영어판 전용) — engmon_yut_en_v1 (한국어판 engmon_yut_v1 은 처음 한 번 읽기만)
================================================================ */
const Store = {
  KEY: "engmon_yut_en_v1",
  KO_KEY: "engmon_yut_v1", // 한국어판 저장 (읽기만 한다)
  data: null,
  warned: false,
  defaults() {
    return {
      version: 1,
      sound: true,
      settings: { pieces: 4, backdo: true, cpu: "easy", t0: "kid", t1: "mom", battle: true, skills: true, study: true },
      lastPicks: {},      // { 프로필 id: [ids] } — 다음 판에 미리 채워 둠
      profiles: null,     // 👤 { id: { id, name, avatar, collection, bag, stats, study, cloud } } — 사람마다 따로 (v2026-10-02)
      order: [],          // 프로필 순서
      seenSkills: [],     // 기술 도감: 판에서 본 기술 (패드 하나에 같이)
      game: null,         // 진행 중인 판
      lastGame: null,     // 끝난 판 (한 판 더)
    };
  },
  load() {
    const d = this.defaults();
    let raw = null;
    try {
      raw = JSON.parse(localStorage.getItem(this.KEY));
      // 🇰🇷 처음 열면 한국어판(같은 주소 ian939.github.io 라 저장을 읽을 수 있다)의 프로필·포켓몬·볼을 한 번 가져온다 — 하던 판은 빼고
      if (!raw && Q.get("fresh") !== "1") {
        const ko = JSON.parse(localStorage.getItem(this.KO_KEY));
        if (ko && typeof ko === "object" && ko.profiles) {
          // 💾 저장 코드는 가져오지 않는다 — 두 판이 같은 코드에 번갈아 쓰면 기록이 엉킨다 (영어판은 새 코드를 따로 켠다)
          Object.values(ko.profiles).forEach(p => { if (p) p.cloud = null; });
          raw = Object.assign({}, ko, { game: null, lastGame: null, fromKo: true });
        }
      }
      if (raw && typeof raw === "object") {
        Object.assign(d, raw);
        delete d.familyDex; // 옛 버전(잉글리시몬 가족 도감 읽기)이 남긴 것
        d.settings = Object.assign(this.defaults().settings, raw.settings || {});
        d.seenSkills = (Array.isArray(raw.seenSkills) ? raw.seenSkills : []).filter(k => Yut.SKILLS[k]);
        d.lastPicks = raw.lastPicks && typeof raw.lastPicks === "object" ? raw.lastPicks : {};
      }
    } catch (e) { raw = null; /* 망가진 저장은 새로 시작 */ }
    // 👤 프로필: 처음이면 하나만 — 이름 '꿈꾸는아이' (사용자 요청 2026-10-02, 더 필요하면 ➕ 새 프로필), 예전 기록(패드에 하나로 모은 것)은 이 프로필 것으로
    // 이 패드 기록에 가족 대결 이긴 사람이 있으면 그 사람 프로필도 만든다 (기록이 사라지지 않게). 시험용 ?fam=1 = 가족 6명
    if (!d.profiles || typeof d.profiles !== "object" || !Object.keys(d.profiles).length) {
      d.profiles = {};
      const famWins = (raw && raw.stats && raw.stats.family) || {};
      MEMBERS.filter(m => m.key === "kid" || Q.get("fam") === "1" || Number(famWins[m.key]) > 0)
        .forEach(m => { d.profiles[m.key] = blankProfile(m.key, m.key === "kid" ? DEFAULT_NAME : plain(m.name), DEFAULT_AV[m.key] || 25); });
      d.trim1 = true; // 새로 만든 프로필은 아래 "안 쓴 기본 프로필 치우기"를 하지 않는다
      if (raw && typeof raw === "object") {
        const k = d.profiles.kid, st = raw.stats || {};
        if (Array.isArray(raw.collection)) k.collection = raw.collection;
        if (raw.bag) k.bag = raw.bag;
        if (raw.study) k.study = raw.study;
        if (raw.cloud) k.cloud = raw.cloud;
        Object.assign(k.stats, { games: st.games || 0, rocket: st.rocket || k.stats.rocket, net: st.net || k.stats.net, boxes: st.boxes || 0, wildSeen: st.wildSeen || 0, wildCaught: st.wildCaught || 0 });
        Object.keys(st.family || {}).forEach(key => { if (d.profiles[key]) d.profiles[key].stats.family.win = Number(st.family[key]) || 0; });
        if (raw.lastPicks && raw.lastPicks.guest && !d.lastPicks.kid) d.lastPicks.kid = raw.lastPicks.guest;
      }
      d.order = MEMBERS.map(m => m.key).filter(k => d.profiles[k]);
    }
    // 예전 버전이 만든 가족 6명 중 한 번도 안 쓴 프로필은 한 번만 치운다 (이름 그대로 · 포켓몬 0 · 판 0 · 저장 안 함 · 볼 그대로 · 공부 기록 없음 · 판에 없음)
    if (!d.trim1) {
      const inGame = new Set([d.game, d.lastGame].filter(Boolean).flatMap(g => (g.teams || []).map(t => t.key)));
      MEMBERS.forEach(m => {
        const p = d.profiles[m.key];
        if (!p || m.key === "kid" || inGame.has(m.key)) return;
        const st = p.stats || {}, bag = p.bag || {};
        const untouched = p.name === plain(m.name) && !(p.collection || []).length && !(st.games || 0) && !p.cloud && !Object.keys(p.study || {}).length &&
          ["family", "rocket", "net"].every(k => !((st[k] || {}).win || (st[k] || {}).lose)) &&
          (bag.poke || 0) === 3 && !(bag.great || bag.ultra || bag.luxury || bag.master);
        if (untouched) delete d.profiles[m.key];
      });
      d.trim1 = true;
    }
    ["collection", "bag", "stats", "study", "cloud", "netName"].forEach(k => { delete d[k]; });
    Object.keys(d.profiles).forEach(id => { d.profiles[id] = normProfile(d.profiles[id], id); });
    d.order = (Array.isArray(d.order) ? d.order : []).filter((id, i, a) => d.profiles[id] && a.indexOf(id) === i);
    Object.keys(d.profiles).forEach(id => { if (d.order.indexOf(id) < 0) d.order.push(id); });
    if (!d.profiles[d.settings.t0]) d.settings.t0 = d.order[0];
    if (!d.profiles[d.settings.t1] || d.settings.t1 === d.settings.t0) d.settings.t1 = d.order.find(id => id !== d.settings.t0) || null; // 프로필이 하나면 두 번째 팀은 비워 둔다
    d.game = Yut.upgrade(d.game); d.lastGame = Yut.upgrade(d.lastGame); // 기술 전(v1) 판은 기술 없이 이어서
    if (d.game && !Yut.validate(d.game)) d.game = null;
    if (d.lastGame && !Yut.validate(d.lastGame)) d.lastGame = null;
    [d.game, d.lastGame].forEach(g => g && g.teams.forEach((t, ti) => {
      if (t.cpu) { t.name = ROCKET_TEAM.name; t.color = ROCKET_TEAM.color; return; }
      const p = d.profiles[t.key];
      if (p) { t.name = p.name; t.avatar = p.avatar; }
      t.color = TEAM_COLORS[ti] || t.color;
    }));
    // 예전 코드가 쓰던 Store.data.collection · bag · stats · study · cloud 는 "지금 프로필"(Store.cur)을 가리킨다 (저장 글자에는 안 들어감)
    ["collection", "bag", "stats", "study", "cloud"].forEach(k => Object.defineProperty(d, k, {
      configurable: true, enumerable: false,
      get: () => { const p = Store.prof(); return p ? p[k] : undefined; },
      set: v => { const p = Store.prof(); if (p) p[k] = v; },
    }));
    this.data = d;
    if (!this.cur || !d.profiles[this.cur]) this.cur = d.settings.t0;
  },
  cur: null, // 지금 쓰는 프로필 id (풀숲에서 잡은 팀 · 상자를 받는 팀 · 가방 창에서 고른 사람)
  prof(id) { const P = this.data && this.data.profiles; if (!P) return null; return P[id || this.cur] || P[this.data.settings.t0] || P[this.data.order[0]] || null; },
  use(id) { if (id && this.data.profiles[id]) this.cur = id; return this.prof(); },
  save() {
    try { cloudSchedule(); } catch (e) { /* 아직 준비 전 */ }
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); }
    catch (e) {
      if (!this.warned) { this.warned = true; toast("Can't save here. If you close this page, the game is lost 🥲", 3200); }
    }
  },
};

/* ================================================================
   소리 — 효과음(Web Audio 합성) · 한국어 읽어 주기 · 울음소리
================================================================ */
const SFX = {
  ctx: null,
  ensure() {
    if (Store.data.sound === false) return false;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      try { this.ctx = new AC(); } catch (e) { return false; }
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
    return true;
  },
  tone(f, d, type, delay, peak) {
    if (!this.ensure()) return;
    d = d || 0.12; delay = (delay || 0) * SPEED; peak = peak || 0.18;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t0); o.stop(t0 + d + 0.05);
  },
  tap() { this.tone(700, 0.05, "triangle", 0, 0.1); },
  pop() { this.tone(500, 0.06, "square", 0, 0.08); this.tone(900, 0.08, "square", 0.05, 0.08); },
  rattle() { for (let i = 0; i < 8; i++) this.tone(260 + Math.random() * 420, 0.035, "square", i * 0.075, 0.06); },
  land() { this.tone(170, 0.09, "triangle", 0, 0.2); this.tone(120, 0.1, "triangle", 0.07, 0.18); },
  result(r) {
    if (r >= 4) [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.16, "triangle", i * 0.08));
    else if (r < 0) [440, 370, 311].forEach((f, i) => this.tone(f, 0.16, "sine", i * 0.1));
    else [523, 659, 784].slice(0, r).forEach((f, i) => this.tone(f, 0.14, "triangle", i * 0.08));
  },
  hop(k) { this.tone(480 + (k % 5) * 70, 0.05, "square", 0, 0.05); },
  attack() { this.tone(480, 0.09, "sawtooth", 0, 0.12); this.tone(720, 0.12, "sawtooth", 0.07, 0.12); },
  capture() { this.tone(900, 0.08, "square", 0, 0.1); this.tone(600, 0.1, "square", 0.08, 0.1); this.tone(300, 0.18, "square", 0.16, 0.1); },
  stack() { this.tone(660, 0.08, "triangle", 0); this.tone(880, 0.12, "triangle", 0.08); },
  evolve() { [392, 440, 494, 523, 587, 659, 740, 784, 880, 988, 1047].forEach((f, i) => this.tone(f, 0.09, "sine", i * 0.08, 0.12)); },
  finish() { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.2, "triangle", i * 0.1)); },
  win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.22, "triangle", i * 0.14)); },
  again() { [1047, 1319, 1568].forEach((f, i) => this.tone(f, 0.12, "sine", i * 0.07, 0.12)); },
  alarm() { for (let i = 0; i < 4; i++) { this.tone(880, 0.14, "square", i * 0.3, 0.08); this.tone(660, 0.14, "square", i * 0.3 + 0.15, 0.08); } },
  // 배틀 (잉글리시몬 모험 화면과 같은 소리)
  battle() { [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.1, "square", i * 0.07, 0.07)); this.tone(131, 0.4, "triangle", 0, 0.16); },
  hit() { this.tone(150, 0.18, "square", 0, 0.22); this.tone(90, 0.24, "sine", 0.05, 0.2); },
  runHome() { [880, 660, 520, 700].forEach((f, i) => this.tone(f, 0.08, "triangle", i * 0.07, 0.1)); },
  throwBall() { this.tone(300, 0.25, "sine", 0, 0.15); this.tone(500, 0.15, "sine", 0.2, 0.12); },
  shake() { this.tone(120, 0.15, "sine", 0, 0.25); },
  catchOk() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.16, "sine", i * 0.1)); },
  skill() { [330, 440, 587, 784, 1175].forEach((f, i) => this.tone(f, 0.08, "sawtooth", i * 0.045, 0.07)); this.tone(1568, 0.25, "triangle", 0.25, 0.12); },
  learn() { [659, 784, 1047, 1319, 1047, 1568].forEach((f, i) => this.tone(f, 0.14, "triangle", i * 0.09, 0.12)); },
  clang() { this.tone(1200, 0.12, "square", 0, 0.12); this.tone(1800, 0.2, "triangle", 0.04, 0.1); this.tone(600, 0.2, "square", 0.1, 0.08); },
  thud() { this.tone(110, 0.2, "square", 0, 0.2); this.tone(80, 0.25, "sine", 0.06, 0.2); },
};
/* 🔊 영어로 읽어 주기 (영어판) — Edge TTS 로 미리 녹음한 mp3 (assets/voice/, tools/gen-voice.py) 를 먼저 쓰고,
   녹음이 없는 말(사람 이름처럼 직접 쓴 글자)만 브라우저 목소리로 읽는다 (한글이면 한국어 목소리).
   TTS.say(글 또는 [조각, 조각…]) — 하던 말을 끊고 새로 읽는다. 문장 전체가 녹음돼 있으면 그것을, 아니면 조각마다 이어서.
   TTS.sayEn(글) — 하던 말 뒤에 이어서 읽는다.
   녹음할 말 모으기: TTS.say( … ) 안의 글자와 vo("…") 로 감싼 글자 + 포켓몬·기술·볼 이름 (gen-voice.py 가 찾는다) */
function vo(s) { return s; } // 녹음해 둘 문장 표시 (gen-voice.py 가 찾는다) — 하는 일은 없음. const 가 아닌 함수 선언 = 위쪽 RES 에서도 쓸 수 있다
const TTS = {
  en: null, ko: null, voicesLoaded: false,
  seq: 0, chain: Promise.resolve(), live: [], bufs: {},
  init() {
    if (!("speechSynthesis" in window)) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      this.voicesLoaded = vs.length > 0;
      this.en = vs.find(v => /^en(-|_)US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
      this.ko = vs.find(v => /^ko/i.test(v.lang)) || null;
    };
    pick();
    speechSynthesis.onvoiceschanged = pick;
  },
  // 녹음 찾기 열쇠 — gen-voice.py 의 key() 와 똑같이 유지
  key(s) {
    return plain(s).replace(/♀/g, " female").replace(/♂/g, " male").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase().replace(/[’‘`]/g, "'").replace(/[^a-z0-9'\uac00-\ud7a3]+/g, " ").trim();
  },
  clip(text) { const V = window.VOICE || {}; return V[this.key(text)] || null; },
  say(text) { this.stop(); this.queue(text); },
  sayEn(text) { this.queue(text); },
  queue(text) {
    if (Store.data.sound === false) return;
    const parts = (Array.isArray(text) ? text : [text]).map(p => plain(p)).filter(p => this.key(p));
    if (!parts.length) return;
    const whole = parts.join(" ");
    const items = (this.clip(whole) ? [whole] : parts).map(p => ({ text: p, clip: this.clip(p) }));
    items.forEach(it => { if (it.clip) this.load(it.clip[0]).catch(() => {}); }); // 미리 받아 두면 조각 사이가 덜 끊긴다
    const my = this.seq;
    this.chain = this.chain.then(async () => {
      for (const it of items) {
        if (my !== this.seq) return;
        try { await (it.clip ? this.playClip(it.clip, my) : this.synth(it.text, my)); } catch (e) { /* 하나 못 읽어도 다음으로 */ }
      }
    });
  },
  load(file) {
    if (!this.bufs[file]) {
      this.bufs[file] = fetch("assets/voice/" + file).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then(b => new Promise((ok, bad) => { const p = SFX.ctx.decodeAudioData(b, ok, bad); if (p && p.then) p.then(ok, bad); }));
      this.bufs[file].catch(() => { delete this.bufs[file]; });
    }
    return this.bufs[file];
  },
  // clip = [파일, 말 시작(초), 길이(초)] — 앞뒤 빈 소리는 잘라서 조각이 자연스럽게 이어지게
  async playClip(c, my) {
    if (!SFX.ensure()) return;
    let buf = null;
    try { buf = await this.load(c[0]); } catch (e) { return this.playTag(c, my); } // file:// 처럼 fetch 가 안 되면 <audio> 로
    if (my !== this.seq) return;
    await new Promise(done => {
      const src = SFX.ctx.createBufferSource();
      src.buffer = buf;
      src.connect(SFX.ctx.destination);
      src.onended = () => { this.live = this.live.filter(x => x !== src); done(); };
      this.live.push(src);
      const start = Math.max(0, (c[1] || 0) - 0.05);
      src.start(0, start, Math.min(buf.duration - start, (c[2] || buf.duration) + 0.12));
    });
  },
  playTag(c, my) {
    return new Promise(done => {
      try {
        const a = new Audio("assets/voice/" + c[0]);
        const fin = () => { a.pause(); this.live = this.live.filter(x => x !== a); done(); };
        a.onended = fin; a.onerror = fin;
        a.ontimeupdate = () => { if (my !== this.seq || a.currentTime >= (c[1] || 0) + (c[2] || 99) + 0.12) fin(); };
        this.live.push(a);
        a.play().catch(fin);
      } catch (e) { done(); }
    });
  },
  synth(text, my) {
    return new Promise(done => {
      if (!("speechSynthesis" in window) || my !== this.seq) return done();
      const ko = /[\uac00-\ud7a3]/.test(text);
      const v = ko ? this.ko : this.en;
      if (this.voicesLoaded && !v) return done(); // 맞는 목소리가 없으면 읽지 않는다 (엉뚱한 발음 방지)
      try {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = ko ? "ko-KR" : "en-US";
        if (v) u.voice = v;
        u.rate = ko ? 0.95 : 0.9;
        const t = setTimeout(done, 600 + text.length * 120); // onend 가 안 오는 기기 대비
        u.onend = u.onerror = () => { clearTimeout(t); done(); };
        speechSynthesis.speak(u);
      } catch (e) { done(); }
    });
  },
  stop() {
    this.seq++;
    this.live.forEach(x => { try { x.stop ? x.stop() : x.pause(); } catch (e) {} });
    this.live = [];
    this.chain = Promise.resolve();
    try { speechSynthesis.cancel(); } catch (e) {}
  },
};
const Cry = {
  a: null,
  play(id) {
    if (Store.data.sound === false || SPEED < 1) return;
    try {
      if (this.a) this.a.pause();
      const a = new Audio(CRY_BASE + "latest/" + id + ".ogg");
      a.volume = 0.35;
      a.onerror = () => {
        try { const b = new Audio(CRY_BASE + "legacy/" + id + ".ogg"); b.volume = 0.35; b.play().catch(() => {}); this.a = b; } catch (e) {}
      };
      a.play().catch(() => {});
      this.a = a;
    } catch (e) {}
  },
};

let toastTimer = null, hintTimer = null, baseHint = "";
function toast(msg, ms) {
  const h = current === "game" ? $("#hint") : null;
  if (h) {
    // 윷판 화면: 안내 칸(DS 대화창)에 잠깐 보여 주고 원래 안내로 돌아간다
    h.textContent = msg;
    h.classList.add("say");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => { hintTimer = null; h.classList.remove("say"); h.textContent = baseHint; }, (ms || 1800) * Math.max(SPEED, 0.5));
    return;
  }
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), (ms || 1800) * Math.max(SPEED, 0.5));
}
function banner(text, color, ms, cls) {
  ms = ms || 1100;
  return new Promise(res => {
    const b = document.createElement("div");
    b.className = "banner" + (cls ? " " + cls : "");
    b.textContent = text;
    if (color) b.style.setProperty("--bg", color);
    b.style.setProperty("--dur", (ms * SPEED / 1000) + "s");
    document.body.appendChild(b);
    setTimeout(() => { b.remove(); res(); }, ms * SPEED);
  });
}
let modalClose = null;
function showModal(html, onClose) {
  const o = $("#overlay");
  o.innerHTML = '<div class="modal" role="dialog">' + html + "</div>";

}

}

function confetti(n) {
  const colors = ["#ff4f86", "#2f86f6", "#ffc93c", "#26b366", "#9b5de5", "#ff8c42"];
  for (let i = 0; i < (n || 60); i++) {
    const c = document.createElement("i");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.8 + Math.random() * 1.6) * Math.max(SPEED, 0.3) + "s";
    c.style.animationDelay = Math.random() * 0.6 * SPEED + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}
function fxAt(node, html, cls, ms) {
  const fx = $("#fx");
  if (!fx) return null;
  const e = document.createElement("div");
  e.className = cls || "fx-burst";
  const [x, y] = nodeXY(node);
  e.style.left = pct(x); e.style.top = pct(y);
  e.innerHTML = html;
  fx.appendChild(e);
  setTimeout(() => e.remove(), ms || 1200);
  return e;
}
function sparkle(node) {
  ["✨", "⭐", "✨", "🌟", "✨", "⭐"].forEach((s, i) => {
    const e = fxAt(node, s, "spark");
    if (!e) return;
    const a = i / 6 * Math.PI * 2;
    e.style.setProperty("--dx", Math.cos(a) * 70 + "px");
    e.style.setProperty("--dy", Math.sin(a) * 70 - 20 + "px");
  });
}

/* ---------- 포켓몬 고르기 — 스타팅 포켓몬 + ❓ 풀숲에서 잡은 포켓몬 (잡은 순서대로) ---------- */
// 진화 라인의 마지막 모습들 (갈래가 여럿이면 여러 개: 이브이 → 샤미드·쥬피썬더·…)
const EVO_TO = (() => { const m = {}; Object.keys(D.evoFrom).forEach(c => { const p = D.evoFrom[c]; (m[p] = m[p] || []).push(Number(c)); }); return m; })();
const finalsOf = id => (EVO_TO[id] && EVO_TO[id].length) ? [].concat(...EVO_TO[id].map(finalsOf)) : [id];
// 말의 진화 경로: 1단계 → … → 마지막 모습 (스타팅 포켓몬은 1단계라서 끝까지 가야 진화한다). 갈래가 여럿이면 판마다 무작위
function linePath(id, rnd) { const fs = finalsOf(id); return evoPath(fs[Math.floor(rnd() * fs.length)]); }
// 보여 주기용: 갈래가 하나면 끝까지, 여럿이면 고른 포켓몬까지 + "?"
function lineShow(id) { // 고른 모습부터 보여 준다 (리자드를 골랐으면 리자드 › 리자몽)
  const fs = finalsOf(id), full = fs.length > 1 ? evoPath(id) : evoPath(fs[0]);
  return { path: full.slice(Math.max(0, full.indexOf(id))), more: fs.length > 1 };
}

  const out = [];
  (list || []).forEach(id => { if (avail.has(id) && other.indexOf(id) < 0 && !sameFamily(other, id) && out.indexOf(id) < 0 && !sameFamily(out, id)) out.push(id); });
  return out.slice(0, Setup.pieces);
}
function autoPick() {
  const ti = Setup.ti, mine = Setup.picks[ti];
  const other = Setup.mode === "rocket" ? Setup.rocket.slice(0, Setup.pieces) : Setup.picks[1 - ti];
  const free = id => mine.indexOf(id) < 0 && other.indexOf(id) < 0 && !sameFamily(other, id) && !sameFamily(mine, id);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pool = shuffle(rosterIds(pickPid(ti)).filter(free));
  while (mine.length < Setup.pieces && pool.length) { const id = pool.shift(); if (free(id)) mine.push(id); }
}

function persist() {
  const s = G.s;
  if (s.phase === "over") {
    if (!s.recorded) {
      s.recorded = true;
      const w = s.teams[s.winner];
      // 👤 기록·상자는 그 팀 프로필에 (로켓단 대결 = 사람 팀, 친구 대결 = 이 패드의 내 프로필, 가족 대결 = 두 팀 다)
      const rp = s.settings.mode === "net" ? (G.net && G.net.pid) : s.settings.mode === "rocket" ? (s.teams.find(t => !t.cpu) || {}).key : null;
      if (rp) Store.use(rp);
      const st = Store.data.stats;
      if (s.settings.mode !== "family") st.games = (st.games || 0) + 1;
      if (s.settings.mode === "rocket") { if (w.cpu) st.rocket.lose++; else st.rocket.win++; }
      else if (s.settings.mode === "net" && G.net) {
        const mine = s.winner === G.net.me;
        if (mine) st.net.win++; else st.net.lose++;
        const balls = mine ? Yut.Rewards.rollBox(Yut.Rewards.BOX_SIZE, Math.random) : ["poke"];
        balls.forEach(b => { Store.data.bag[b] = (Store.data.bag[b] || 0) + 1; });
        s.reward = { balls, opened: false, lose: !mine, to: rp };
        st.boxes = (st.boxes || 0) + 1;
        Store.data.net = null; // 끝난 친구 대결은 이어하기에서 빼기
      }
      else s.teams.forEach((t, ti) => { const p = Store.data.profiles[t.key]; if (!p) return; p.stats.games++; if (ti === s.winner) p.stats.family.win++; else p.stats.family.lose++; });
      if (s.settings.mode === "rocket" && !w.cpu) {
        const forced = (Q.get("box") || "").split(",").filter(b => Yut.Rewards.BALL_INFO[b]); // 테스트용 ?box=master,poke,great
        const hard = s.settings.cpuLevel === "hard"; // 💀 어려움: 볼 4개 + 좋은 볼이 더 잘
        const balls = forced.length ? forced : Yut.Rewards.rollBox(hard ? Yut.Rewards.BOX_SIZE_HARD : Yut.Rewards.BOX_SIZE, Math.random, hard ? Yut.Rewards.BOX_ODDS_HARD : null);
        balls.forEach(b => { Store.data.bag[b] = (Store.data.bag[b] || 0) + 1; });
        s.reward = { balls, opened: false, hard, to: rp };
        st.boxes = (st.boxes || 0) + 1;
      } else if (s.settings.mode === "rocket" && w.cpu) {
        // 로켓단이 이겨도 위로 상자: 몬스터볼 1개 (+ 돈 문제로 하나 더) — 져도 속상하지 않게 (사용자 요청 2026-09-26)
        const balls = ["poke"];
        balls.forEach(b => { Store.data.bag[b] = (Store.data.bag[b] || 0) + 1; });
        s.reward = { balls, opened: false, lose: true, to: rp };
        st.boxes = (st.boxes || 0) + 1;
      }
    }
    Store.data.game = null;
    Store.data.lastGame = s;
  } else Store.data.game = s;
  Store.save();
}

function afterAction() {
  if (current !== "game" || !G.s) return;

  renderAll();

  if (G.s.gifts && G.s.gifts.length && !G.s.teams[G.s.gifts[0].team].cpu && (!netOn() || G.s.gifts[0].team === G.net.me)) { openGiftChooser(); return; } // 🎁 누구에게 줄까?
  if (netOn() && !humanTurn()) { // 🏠 친구 차례 — 친구 패드에서 올라오기를 기다린다

/* ---------- 말 고르기 ---------- */
function distinctDests(ms) {
  const by = {};
  ms.forEach(m => {
    const k = m.finish ? "goal" : String(m.to.node);
    if (!by[k] || (m.finish && m.result < by[k].result)) by[k] = m; // 골인은 가장 작은 결과로
  });
  return Object.keys(by).map(k => by[k]);
}
function prepareChoose() {
  const units = Array.from(new Set(G.moves.map(m => m.unit)));
  units.forEach(u => {
    if (u === "new") $$(".pchip.wait").filter(c => G.s.pieces[Number(c.dataset.piece)].team === G.s.turn).forEach(c => c.classList.add("can"));
    else { const el = unitAt(G.s.turn, u.slice(1)); if (el) el.classList.add("can"); }
  });
  if (units.length === 1) select(units[0]);
  hint(units.length === 1 ? "👆 Tap a sparkling space!" : "👆 First, pick a piece to move!");
}
function select(key, cpu) {
